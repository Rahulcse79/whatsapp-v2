# ---- JVM -------------------------------------------------------------------
# Sized for CI runners. Builds run in GitHub Actions, not on a developer laptop.
#
# 2 GB was not enough. :app:packageRelease died with OutOfMemoryError inside
# zipflinger's Compressor.deflate: the SIP stack ships native libraries for three
# ABIs, packaging holds a file's bytes and its deflate buffer in memory at once, and
# org.gradle.parallel means several of those run together. It failed intermittently,
# which is the worst kind of build failure - the same commit passed on a retry.
# GitHub's ubuntu-latest runner has 16 GB, so the daemons are given a real budget and
# the Kotlin daemon is bounded so the two cannot add up past it.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# ---- Gradle ----------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# ---- Kotlin ----------------------------------------------------------------
kotlin.code.style=official

# ---- Android ---------------------------------------------------------------
# Read from Task 4 onward, when the first module applies the Android plugin.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# R8 full mode (Task 64, DoD 1). The default since AGP 8.0, stated here so an upgrade
# that changed the default could not quietly turn optimisation off - and so the setting
# is somewhere a person reads rather than somewhere they have to know to look.
android.enableR8.fullMode=true

# --------------------------------------------------------------- native stack
# Declared here, once, because two things read them: Gradle (natively, through
# providers.gradleProperty) and ./build.sh (by reading this file). They used to be a
# default inside three .kts files plus a second copy in build.sh, which is the shape that
# drifts — a pin moved in Gradle would leave build.sh warning about the old one: silent on
# a build that is wrong, noisy on one that is right. The .orElse() fallbacks in
# pjsip/build.gradle.kts, pjsip/api/build.gradle.kts and app/build.gradle.kts stay as the
# answer for a tree with no gradle.properties; they no longer decide anything here.

# Every ABI this project supports (N-6). -Ppjsip.abis narrows it for one build; ./build.sh
# validates --abi against this list and --all-abis expands to it.
pjsip.abis=arm64-v8a,armeabi-v7a,x86_64

# The SWIG the shipped bindings are generated with. 4.4.1 renames add/reserve to
# doAdd/doReserve, so a library built by one and bindings generated by another do not share
# JNI names — ./build.sh warns when the binary on PATH is not this.
pjsip.swig.version=4.2.0
