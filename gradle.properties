# ---- JVM -------------------------------------------------------------------
# Sized for CI runners. Builds run in GitHub Actions, not on a developer laptop.
#
# 2 GB was not enough. :app:packageRelease died with OutOfMemoryError inside
# zipflinger's Compressor.deflate: the SIP stack ships native libraries for three
# ABIs, packaging holds a file's bytes and its deflate buffer in memory at once, and
# org.gradle.parallel means several of those run together. It failed intermittently,
# which is the worst kind of build failure - the same commit passed on a retry.
# GitHub's ubuntu-latest runner has 16 GB, so the daemons are given a real budget and
# the Kotlin daemon is bounded so the two cannot add up past it.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# ---- Gradle ----------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# ---- Kotlin ----------------------------------------------------------------
kotlin.code.style=official

# ---- Android ---------------------------------------------------------------
# Read from Task 4 onward, when the first module applies the Android plugin.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
