# Single source of truth for every dependency version (Task 2, done-when #3).
# No version literal may appear in any build.gradle.kts.
#
# Every version here comes from the "Report dependency versions" workflow, which
# queries Maven Central and Google Maven. None is written from memory — doing that
# in Task 2 produced pins that were several major versions stale.

[versions]
# --- Build toolchain (pinned from the bootstrap workflow's version report,
#     not from memory: Gradle 9.7.1 / AGP 9.4.0 / Kotlin 2.4.10 were the latest
#     available at the time of pinning) ---
agp = "9.4.0"
kotlin = "2.4.10"
ksp = "2.3.11"
detekt = "1.23.8"
hilt = "2.60.1"
desugar = "2.1.5"
composeBom = "2026.08.00"
coroutines = "1.11.0"
# From the version report against Belledonne's repository. Note their maven-metadata
# <release> tag says 5.4.125 while 5.5.18 is the newest non-prerelease listed; 5.5.18 is
# pinned and CI resolution is what confirms it.
linphone = "5.5.18"
kover = "0.9.9"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxHiltNavigation = "1.4.0"
androidxNavigation = "2.10.0"
androidxDatastore = "1.2.1"
androidxRoom = "2.8.4"
androidxCore = "1.19.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
robolectric = "4.16.1"
turbine = "1.2.1"
javaxInject = "1"

jvmToolchain = "17"

# --- Android SDK levels (§3) ---
# minSdk 26 is a hard requirement (§3).
#
# compileSdk 37 is not a preference: androidx.core 1.19.0 (the current stable) refuses
# to be consumed by anything compiled against less, and AAR metadata enforces it. CI
# installs the platform explicitly, because runner images lag the newest API level.
minSdk = "26"
compileSdk = "37"
targetSdk = "37"

[libraries]
# Only entries that are actually used. An unused catalog entry is noise.

# --- Consumed by the build-logic convention plugins (Task 3) ---
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

# ktlint rules reach the build through detekt-formatting rather than a second
# plugin: the jlleitschuh ktlint-gradle plugin is not published to Maven Central.
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

# --- Runtime ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Test ---
# The @Inject annotation only - a plain JVM library, not Android, so :domain can carry
# it without breaking the layer rule. Use cases annotate their constructors here and the
# DI layer above wires them without needing a module per use case.
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }

kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

# The JUnit BINDING for kotlin-test. The Kotlin JVM plugin picks this automatically for
# JVM modules, but AGP does not, so `kotlin.test.Test` - a typealias this artifact
# supplies - is unresolved in Android modules without it. Its version tracks Kotlin, so
# there is no separate pin to keep in step.
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }
linphone-sdk = { group = "org.linphone", name = "linphone-sdk-android", version.ref = "linphone" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

# Versions come from the Compose BOM, which the whatsappv2.android.compose convention
# plugin applies - which is why these carry no version of their own.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "androidxRoom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
androidx-room = { id = "androidx.room", version.ref = "androidxRoom" }

# --- Convention plugins provided by the `build-logic` included build (Task 3) ---
whatsappv2-android-application = { id = "whatsappv2.android.application" }
whatsappv2-android-library = { id = "whatsappv2.android.library" }
whatsappv2-android-compose = { id = "whatsappv2.android.compose" }
whatsappv2-jvm-library = { id = "whatsappv2.jvm.library" }
whatsappv2-hilt = { id = "whatsappv2.hilt" }
whatsappv2-detekt = { id = "whatsappv2.detekt" }
