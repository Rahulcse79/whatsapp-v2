# Overrides on top of detekt's defaults (buildUponDefaultConfig = true).
# Only rules we deliberately disagree with are listed — everything else stays at
# detekt's default so a detekt upgrade brings new rules in rather than silently
# skipping them.

build:
  maxIssues: 0

complexity:
  LongParameterList:
    # Compose functions and SipAccount legitimately take many parameters (§5.1 has
    # 18 account fields). Constructor injection is not a smell here.
    functionThreshold: 8
    constructorThreshold: 20
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    # A method whose whole body is one `when` over a closed set is a lookup table, not
    # branching logic. SipError has 21 cases and Task 44 gives each exactly one sentence;
    # the exhaustive `when` is what makes the compiler refuse a new case until somebody
    # has written its sentence, and splitting the table to satisfy an arithmetic
    # threshold would scatter it and cost that guarantee. Anything that is more than one
    # `when` is still counted, which is where the rule earns its keep.
    ignoreSingleWhenExpression: true
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    ignorePrivate: true
    ignoreOverridden: true
    # A Room DAO is a generated-implementation boundary, not a class doing too much: its
    # methods are queries against one table. Splitting one would also break @Transaction
    # methods, which must call sibling queries on the same interface to stay atomic.
    ignoreAnnotated:
      - "Dao"

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    # A TODO must carry a ticket reference, not sit as an anonymous reminder.
    # Prototype markers are exactly what §1 forbids shipping.
    comments:
      - reason: "Reference a task number, e.g. TODO(Task 12)."
        value: "FIXME:"
      - reason: "Reference a task number, e.g. TODO(Task 12)."
        value: "STOPSHIP:"
  ForbiddenImport:
    active: true
    # :app supplies the Android-backed Logger implementation, so it is the one place
    # besides the facade itself that may touch the platform logger.
    excludes: ['**/app/src/debug/**', '**/app/src/release/**']
    imports:
      - value: 'android.util.Log'
        reason: >-
          Use the Logger facade in :core:common. Release builds must not emit SIP
          messages, credentials, phone numbers or contact data (§7, DoD 12).
      - value: 'java.util.logging.**'
        reason: 'Use the Logger facade in :core:common.'
      - value: 'kotlin.io.println'
        reason: 'Use the Logger facade in :core:common.'
  UnusedPrivateMember:
    # Preview functions are entry points for the IDE and for Compose tooling, not dead
    # code. They are private precisely so nothing else calls them, which is exactly what
    # this rule would otherwise punish.
    ignoreAnnotated:
      - 'Preview'
      - 'ThemePreviews'
      - 'ThemeAndFontPreviews'
      - 'Composable'
  ReturnCount:
    max: 3
    excludeGuardClauses: true

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ["Composable"]

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

formatting:
  # Supplied by detekt-formatting (ktlint rules).
  active: true
  android: true
  MaximumLineLength:
    maxLineLength: 120
  ArgumentListWrapping:
    active: true
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
