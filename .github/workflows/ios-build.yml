# Builds both platforms for the iOS port, on runners that have the toolchains the
# development machine does not.
#
# ## Why this workflow exists
#
# The Mac this port is being written on runs macOS 12.7.6 with the Command Line Tools and
# no Xcode, so there is no iPhoneOS SDK, no simulator and no `xcodebuild` — nothing iOS
# can be compiled or run there at all. A GitHub macOS runner has all three, so CI is the
# only place the iOS half of this repository can be verified today. That makes this
# workflow the verification loop for the port rather than a formality on top of one.
#
# ## What it actually checks, and what it deliberately does not
#
# `shared-ios` is the real iOS work available right now: it compiles the `:shared` Kotlin
# Multiplatform module for an iOS target and runs its tests **on a simulator**. Those 73
# assertions about the adaptive video ladder have only ever run on a JVM; this is the
# first time the same code executes on iOS.
#
# `ios-app` is **skipped, not passed**, while no Xcode project of ours exists. A job that
# printed "nothing to build" and went green would read as "iOS builds fine" on the run
# page, which is the one impression this workflow must never give. A skipped job is
# unambiguous. The condition is computed from the filesystem, so the job starts running
# by itself on the commit that adds the project — no edit here required.
#
# `android` is on ubuntu rather than macOS deliberately: it needs no Apple toolchain, and
# macOS runner minutes bill at ten times the rate. It runs `./build.sh android`, which is
# a full native build — PJSIP, OpenSSL, libvpx and the Lyra/TensorFlow Lite closure from
# vendored source — so it is slow by construction, not by accident.
name: iOS port

on:
  push:
    branches: [feature/ios-port]
  pull_request:
    branches: [feature/ios-port]
  workflow_dispatch:
    inputs:
      run-android:
        description: "Also build the Android APK (slow: a full native build)"
        type: boolean
        default: false

# A second push supersedes the first: these jobs are long and there is no value in two
# native builds of the same branch racing each other.
concurrency:
  group: ios-port-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- inspection
  #
  # One cheap job whose only output is what the repository actually contains, so the jobs
  # below branch on evidence rather than on an assumption baked into this file.
  inspect:
    name: What is in the repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-xcode-project: ${{ steps.look.outputs.has-xcode-project }}
      xcode-project: ${{ steps.look.outputs.xcode-project }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for an iOS application target of our own
        id: look
        run: |
          # third_party/ is full of vendored sample apps -- TensorFlow Lite's examples and
          # pjproject's own ios-swift-pjsua2 among them -- and matching one of those would
          # send xcodebuild off to build somebody else's demo. Only our tree counts.
          project="$(find . -name '*.xcodeproj' -maxdepth 3 \
                       -not -path './third_party/*' \
                       -not -path './.claude/*' 2>/dev/null | head -1 || true)"
          if [ -n "$project" ]; then
            echo "has-xcode-project=true" >> "$GITHUB_OUTPUT"
            echo "xcode-project=$project" >> "$GITHUB_OUTPUT"
            echo "Found $project"
          else
            echo "has-xcode-project=false" >> "$GITHUB_OUTPUT"
            echo "xcode-project=" >> "$GITHUB_OUTPUT"
            {
              echo "### No iOS application target yet"
              echo
              echo 'There is no `.xcodeproj` of ours in this repository, so the `ios-app`'
              echo 'job is **skipped rather than passed** — nothing was built for iOS as'
              echo 'an application. The shared Kotlin module is still compiled and tested'
              echo 'on an iOS simulator by the `shared-ios` job.'
              echo
              echo 'See `docs/ios-port.md` for the phase this sits in.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------ static checks
  #
  # Everything that can be checked without an iOS SDK, on the cheapest runner that has
  # a Swift compiler. It runs BEFORE the expensive jobs and they do not depend on it,
  # deliberately: a syntax error should turn the run red in two minutes rather than
  # after an hour of cross-compiling, and an unrelated failure here should not hide
  # whether the real build works.
  static:
    name: Static checks (no iOS SDK needed)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # ShellCheck is not on the runner image and check-all.sh skips it when absent, so
      # installing it here is what makes the shell linting actually run in CI.
      - name: Install ShellCheck
        run: brew list --formula shellcheck >/dev/null 2>&1 || brew install shellcheck
      - name: Run every check that does not need Xcode
        run: ios/scripts/check-all.sh

  # ------------------------------------------------------------- shared on iOS
  shared-ios:
    name: Shared KMP module, compiled and tested on iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Stated rather than assumed. Which Xcode and which SDKs a runner image carries
      # changes without notice, and when a Kotlin/Native link fails the first question is
      # always which toolchain it was using.
      - name: Report the Apple toolchain this runner has
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          echo "iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "architecture: $(uname -m)"
          xcrun simctl list runtimes | head -20

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native downloads a toolchain of its own, outside the Gradle caches, and it
      # is around a gigabyte. Without this every run pays for it again.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The targets in shared/build.gradle.kts are declared only when an iOS SDK is
      # present, so this also proves the detection works on a machine that has one: if
      # these tasks do not exist, the guard is wrong and the build says so here.
      - name: List the iOS tasks Gradle actually created
        run: ./gradlew :shared:tasks --all | grep -iE "ios|link|framework" || true

      - name: Compile the shared module for iOS, device and simulator
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64

      # The point of the whole job: the shared logic running on iOS rather than on a JVM.
      - name: Run the shared tests on an iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Assemble the XCFramework the app will link against
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: Upload the shared test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-ios-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: warn

      - name: Upload the shared framework
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: shared-ios-framework
          path: |
            shared/build/XCFrameworks/
            shared/build/bin/iosSimulatorArm64/
          if-no-files-found: warn

  # -------------------------------------------------------------------- iOS app
  #
  # Runs only once an Xcode project of ours exists. The `inspect` job computes that from
  # the filesystem, so this begins running by itself on the commit that adds one.
  #
  # Three things happen here that cannot happen on the development machine: PJSIP is
  # cross-compiled for iOS, the app is built, and an .ipa is packed. The IPA is
  # **unsigned** unless signing secrets are configured — see the two build steps below.
  ios-app:
    name: iOS app and IPA
    needs: [inspect]
    if: needs.inspect.outputs.has-xcode-project == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    # Computed here and not in the step below, because the two contexts are asymmetric:
    # a job's `env` may read `secrets`, and a step's `if` may read `env` -- but a step's
    # `if` may NOT read `secrets`, and a step's own `env` is not visible to its own `if`.
    # Getting that backwards is what made the first run of this workflow invalid.
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12 != '' && secrets.IOS_PROVISIONING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Report the Apple toolchain this runner has
        run: |
          sw_vers
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "architecture: $(uname -m)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # PJSIP, OpenSSL, Opus and libvpx are an hour from cold. The script keeps
      # content-hash stamps per vendored tree, so a cache hit makes the whole stage a
      # few seconds -- and a bumped dependency correctly invalidates only its own stamp.
      - name: Cache the iOS native build
        uses: actions/cache@v4
        with:
          path: |
            build/ios-native
            ios/Vendor
          key: ios-native-${{ runner.os }}-${{ hashFiles('ios/config/pj/config_site.h', 'ios/scripts/build-pjsip-ios.sh') }}-${{ hashFiles('third_party/pjproject/version.mak') }}
          restore-keys: ios-native-${{ runner.os }}-

      # autoconf and automake are not on the macOS runner image by default, and opus
      # generates its configure with them.
      # `brew install` on a formula the image already carries can exit non-zero, and a
      # runner image's contents change without notice — so ask before installing rather
      # than letting a warning fail the job.
      - name: Install the autotools
        run: |
          for f in autoconf automake libtool; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done
          autoconf --version | head -1
          automake --version | head -1

      # DEVICE ONLY. The deliverable of this job is an .ipa, which is the device
      # slice; a simulator slice would add most of the job's runtime to produce
      # something only the machine running the simulator can use. `./build.sh ios`
      # builds the host's simulator architecture locally, where it is useful.
      - name: Build PJSIP for iOS (device)
        run: ios/scripts/build-pjsip-ios.sh --device

      - name: Build the shared Kotlin framework
        run: ios/scripts/build-shared-framework.sh Release

      # Regenerated rather than trusted. The generator is deterministic, so a commit that
      # added a Swift file without re-running it shows up here as a diff -- which is the
      # only way to catch a source file that is in the tree and not in the build.
      - name: Regenerate the Xcode project and check it is up to date
        run: |
          python3 ios/scripts/generate-xcodeproj.py
          if ! git diff --quiet -- ios/WhatsAppV2.xcodeproj; then
            echo "::error::ios/WhatsAppV2.xcodeproj is stale. Run python3 ios/scripts/generate-xcodeproj.py and commit."
            git diff --stat -- ios/WhatsAppV2.xcodeproj
            exit 1
          fi

      # The unsigned device IPA. This is the artefact that can be uploaded to
      # BrowserStack, which re-signs with its own certificate before installing. It is
      # NOT directly installable on a handset -- `verify-ipa.sh` says so in as many
      # words rather than leaving the filename to imply otherwise.
      - name: Build the unsigned device IPA
        run: ios/scripts/build-ipa.sh --unsigned

      - name: Say what the IPA actually is
        run: |
          ios/scripts/verify-ipa.sh build/ios-ipa/WhatsAppV2-unsigned.ipa | tee /tmp/ipa-report.txt
          {
            echo "### iOS IPA"
            echo
            echo '```'
            cat /tmp/ipa-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unsigned IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-unsigned
          path: build/ios-ipa/*.ipa
          if-no-files-found: error

      # A signed IPA, when and only when the repository has been given a certificate and
      # a profile. A fork, or a repository nobody has configured, gets the unsigned build
      # above and no confusing signing failure.
      - name: Import the signing material
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          # A keychain of this run's own, with a password that exists only here. The
          # login keychain is not touched, and the whole thing goes away with the runner.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          # Without this, codesign prompts for permission to use the key -- and a prompt
          # on a headless runner is a step that hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/ci.mobileprovision

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build the signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          ios/scripts/build-ipa.sh --signed
          ios/scripts/verify-ipa.sh build/ios-ipa/WhatsAppV2-signed.ipa

      - name: Upload the signed IPA
        if: env.HAS_SIGNING == 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-signed
          path: build/ios-ipa/WhatsAppV2-signed.ipa
          if-no-files-found: error

  # -------------------------------------------------------------------- Android
  #
  # The existing Android build, unchanged, so this workflow proves the port has not cost
  # the platform that already works.
  android:
    name: Android APK
    # OFF by default on this branch, deliberately.
    #
    # It is a full native build — PJSIP, OpenSSL, libvpx and the Lyra/TFLite closure
    # from vendored source — so it runs for the better part of an hour, and on a branch
    # being iterated for the iOS build it answers a question that has already been
    # answered: run 38864975949 built it green after the shared-module move. Re-proving
    # that on every iOS fix is an hour of runner time per attempt for no new
    # information.
    #
    # Ask for it with `gh workflow run ios-build.yml -f run-android=true`, and it runs
    # by itself on a pull request, which is the point at which "has the port cost the
    # platform that already works" has to be answered again.
    if: github.event_name == 'pull_request' || inputs.run-android == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # r27c, the version gradle.properties pins and the one 16 KB page alignment needs.
      - name: Set up the NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # No local-cache. A restored cache is what produced the dangling `clang`
          # symlink below: the entry restores, the link does not resolve, and every
          # check short of running the compiler believes it is there.
          local-cache: false

      # Debian packages the Java typemaps with swig itself, which build.sh's own error
      # message says; on MacPorts they are a separate port, which is why it checks.
      - name: Install SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
          swig -version

      # Lifted from build-pjsip.yml, which already learned this: nttld/setup-ndk promises
      # no particular layout, and passing its reported path straight through gave CMake
      # a clang that is not there --
      #   CMAKE_C_COMPILER .../prebuilt/linux-x86_64/bin/clang is not a full path to an
      #   existing compiler tool
      # Find a root that actually carries a compiler instead of assuming one does.
      - name: Locate the NDK toolchain
        run: |
          set -euo pipefail
          clang=""
          for root in "${{ steps.ndk.outputs.ndk-path }}" \
                      "${ANDROID_NDK_LATEST_HOME:-}" \
                      "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/*; do
            [ -n "$root" ] && [ -d "$root" ] || continue
            # No -type f: clang is a symlink in some layouts, and a symlink to a working
            # compiler is a working compiler.
            found="$(find "$root" -path '*/toolchains/llvm/prebuilt/*/bin/clang' 2>/dev/null | head -1)"
            # Ask the compiler to identify itself rather than trusting that the path
            # exists. `find` without -type f matches a DANGLING symlink too, and that is
            # exactly what the first attempt accepted: the step reported
            # "using NDK at /home/runner/.setup-ndk/r27c" and CMake then said that very
            # path "is not a full path to an existing compiler tool". A compiler that
            # cannot print its version is not a compiler.
            if [ -n "$found" ] && "$found" --version >/dev/null 2>&1; then
              echo "using NDK at $root"; clang="$found"; break
            fi
            if [ -n "$found" ]; then
              echo "skipping $root - clang at $found does not run (dangling symlink?)"
            else
              echo "skipping $root - no clang under toolchains/llvm/prebuilt"
            fi
          done
          if [ -z "$clang" ]; then
            echo "::error::no NDK with a usable clang on this runner"
            exit 1
          fi
          bin="$(dirname "$clang")"
          # bin -> <host> -> prebuilt -> llvm -> toolchains -> the NDK root itself
          ndk="$(cd "$bin/../../../../.." && pwd)"
          echo "NDK root      : $ndk"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build the APK
        run: ./build.sh android

      - name: Upload the APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
