# CI gate. Per ADR-005 this runs entirely on hosted runners and must stay green
# WITHOUT reachability to the FreeSWITCH server — server-backed integration tests
# are a separate, scheduled workflow added in Task 32.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Deliberately NOT cancelling in-progress runs. Cancelling is the usual choice - only
  # the newest commit matters - but when pushes arrive faster than a build completes, it
  # means no run ever finishes and no commit is ever verified. Letting them run costs
  # minutes and buys an actual result per commit.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the Gradle wrapper is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing. Run the 'Bootstrap Gradle wrapper' workflow first."
            exit 1
          fi

      # Checks the wrapper jar against Gradle's published checksums — the jar is a
      # binary committed to the repo, so its provenance is verified, not trusted.
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

      # A workflow with invalid YAML never runs, so it cannot validate itself — but it
      # can validate its siblings. This caught a heredoc terminator at column 0 that
      # silently broke the whole file.
      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(f))
                  print(f"ok   {f}")
              except yaml.YAMLError as e:
                  bad.append(f); print(f"FAIL {f}: {e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ---------------------------------------------------------------------
      # The native toolchain. Required from ADR-007 onward, and the reason is
      # N-14: `:data:sip` takes `:pjsip` unconditionally, `:pjsip` builds
      # libpjsua2.so from third_party/, and a build that produces no .so FAILS.
      # There is no Java-only fallback to fall back to any more, deliberately —
      # it was a path that compiled and could not run.
      #
      # swig is stage 1 (~15 s) and the NDK is stage 2 (~3 min per ABI). Both
      # are TOOLCHAIN, exempt from N-1 and pinned per §2.1.1: an unpinned swig
      # is a silently different JNI surface, so the version is asserted by
      # GeneratePjsua2Bindings rather than accepted.
      - name: Install swig (stage 1 — the pjsua2 Java bindings)
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
          # Printed so a runner-image bump is visible in the log as well as being
          # caught by the build's own version assertion.
          swig -version

      - name: Set up the NDK (stage 2 — r27+, for 16 KB page sizes)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          # NOT cached. With local-cache: true the action restored a tree with
          # `toolchains/llvm/prebuilt` and nothing inside it — an NDK with no
          # compiler, which is worse than no NDK because every later step still
          # looks like it should work.
          local-cache: false
          add-to-path: true

      # The pin, ENFORCED. Asking for r27c is not the same as compiling with it.
      #
      # The runner image ships its own NDK and exports ANDROID_NDK_ROOT pointing at it, so
      # `setup-ndk` downloaded r27c and the build then compiled with the image's
      # **27.3.13750724 — which is r27d**. Nobody would have noticed: r27d is >= r27, so the
      # 16 KB alignment assertion passed and the .so was fine. What was lost is the pin
      # itself, and with it N-11: two builds of the same commit on two runner images would
      # produce different binaries, and the document would still claim r27c.
      #
      # This is the exact defect docs/native-dependencies.md §3 names for SWIG — "an
      # unpinned tool is a silently different .so" — found in this workflow's own wiring.
      - name: Point the build at the NDK we actually pinned
        run: |
          set -euo pipefail
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          [ -n "$ndk" ] && [ -d "$ndk" ] || { echo "::error::setup-ndk reported no path"; exit 1; }

          revision="$(sed -n -E 's/^Pkg.Revision *= *(.*)$/\1/p' "$ndk/source.properties")"
          echo "NDK at        : $ndk"
          echo "Pkg.Revision  : $revision"

          # r27c is 27.2.x. A different revision here means the action resolved something
          # else, and the build must say so rather than compile with it.
          case "$revision" in
            27.2.*) ;;
            *) echo "::error::expected NDK r27c (27.2.x), got $revision. The pin in this"
               echo "::error::workflow and the NDK being used disagree; N-11 is unmeasurable"
               echo "::error::until they do not."
               exit 1 ;;
          esac

          # Overrides the runner image's own export, which is what was winning before.
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # API 37 ships as MINOR-versioned platforms (android-37.0, android-37.1,
      # android-37.2) - there is no plain "android-37" directory, so an exact-match
      # check finds nothing even when the platform is installed.
      - name: Ensure the Android platform this build compiles against is present
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          COMPILE_SDK=$(grep -E '^compileSdk' gradle/libs.versions.toml | grep -oE '[0-9]+')
          echo "compileSdk from the version catalog: $COMPILE_SDK"
          echo "installed platforms:"
          ls -1 "$SDK/platforms" 2>/dev/null | sort -V | sed 's/^/  /' || echo "  (none)"

          if compgen -G "$SDK/platforms/android-$COMPILE_SDK" > /dev/null ||
             compgen -G "$SDK/platforms/android-$COMPILE_SDK.*" > /dev/null; then
            echo "OK - a platform for API $COMPILE_SDK is already installed."
            exit 0
          fi

          echo "installing platforms;android-$COMPILE_SDK"
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$COMPILE_SDK"
          ls -1 "$SDK/platforms" | sort -V

      # Without this, every runner generates its own ~/.android/debug.keystore, so two
      # builds of the same commit are signed by different keys. Android then refuses to
      # update one with the other - INSTALL_FAILED_UPDATE_INCOMPATIBLE - and the only way
      # onto a phone is `adb uninstall`, which takes the SIP accounts, their credentials
      # and the call log with it. Every test build therefore started from an empty app.
      #
      # The keystore stays out of the repository: the gate below still fails the build if
      # one is ever committed, and this writes it to the runner's temp directory, outside
      # the checkout. A debug key signs nothing anyone trusts; it exists so that
      # yesterday's build and today's are the same identity to the package manager.
      #
      # Optional by design. With no secret set - a fork, or a clone of this repo - the
      # step says so and AGP falls back to its per-runner default, exactly as before.
      - name: Stage the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "No DEBUG_KEYSTORE_BASE64 secret is set."
            echo "AGP will generate a debug key for this runner, and the resulting APK"
            echo "will not install over one built by any other run."
            exit 0
          fi

          store="$RUNNER_TEMP/debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$store"

          # A truncated or mis-pasted secret decodes to something that is not a keystore,
          # and the failure would otherwise surface much later as an unsigned APK.
          if ! keytool -list -keystore "$store" \
                 -storepass "${DEBUG_KEYSTORE_PASSWORD:-android}" >/dev/null 2>&1; then
            echo "::error::DEBUG_KEYSTORE_BASE64 did not decode to a keystore readable"
            echo "::error::with DEBUG_KEYSTORE_PASSWORD. Re-create the secret."
            exit 1
          fi

          {
            echo "DEBUG_KEYSTORE_FILE=$store"
            echo "DEBUG_KEYSTORE_PASSWORD=${DEBUG_KEYSTORE_PASSWORD:-android}"
            echo "DEBUG_KEY_ALIAS=${DEBUG_KEY_ALIAS:-androiddebugkey}"
            echo "DEBUG_KEY_PASSWORD=${DEBUG_KEY_PASSWORD:-android}"
          } >> "$GITHUB_ENV"

          echo "Debug builds will be signed with the shared key:"
          keytool -list -keystore "$store" \
            -storepass "${DEBUG_KEYSTORE_PASSWORD:-android}" | grep -i "SHA-256" || true

      # The Lyra closure (ADR-008, Exit A) costs ~25 minutes of TensorFlow Lite compile
      # per ABI, and build-native.sh stamps the result by a content hash of the nineteen
      # vendored trees plus pjsip/lyra/CMakeLists.txt. The stamp is content-based, not
      # mtime-based, so a restored prefix on a fresh checkout is recognised as up to date
      # and the stage is skipped. Only the installed prefix and the stamp are cached —
      # the ~200 MB archive per ABI, not the build tree. The key is the same input set the
      # stamp hashes; a bumped tree or an edited CMake file misses and rebuilds.
      - name: Restore the Lyra closure from cache
        uses: actions/cache@v4
        with:
          path: |
            pjsip/build/tmp/buildPjsua2Native/cmake/*/native/prefix/*/lib/liblyra.a
            pjsip/build/tmp/buildPjsua2Native/cmake/*/native/prefix/*/lyra_encoder.h
            pjsip/build/tmp/buildPjsua2Native/cmake/*/native/prefix/*/lyra_decoder.h
            pjsip/build/tmp/buildPjsua2Native/cmake/*/native/prefix/*/lyra
            pjsip/build/tmp/buildPjsua2Native/cmake/*/native/prefix/*/include
            pjsip/build/tmp/buildPjsua2Native/cmake/*/native/prefix/*/model_coeffs
            pjsip/build/tmp/buildPjsua2Native/cmake/*/native/*/.lyra.stamp
          key: lyra-closure-${{ runner.os }}-${{ hashFiles('pjsip/lyra/CMakeLists.txt', 'third_party/lyra/**', 'third_party/tensorflow/**', 'third_party/abseil-cpp/**', 'third_party/cpuinfo/**', 'third_party/eigen/**', 'third_party/farmhash/**', 'third_party/fft2d/**', 'third_party/flatbuffers/**', 'third_party/FP16/**', 'third_party/FXdiv/**', 'third_party/gemmlowp/**', 'third_party/neon2sse/**', 'third_party/psimd/**', 'third_party/pthreadpool/**', 'third_party/ruy/**', 'third_party/xnnpack/**', 'third_party/audio_dsp/**', 'third_party/glog/**', 'third_party/gulrak-filesystem/**') }}

      - name: Build
        # warningsAsErrors is CI-only: locally a deprecation warning should not stop
        # work, but in CI warnings must not be allowed to accumulate.
        run: ./gradlew build --stacktrace -PwarningsAsErrors=true

      - name: Static analysis
        run: ./gradlew detekt lint --stacktrace

      # Task 12: the layer rules run in the build, so a violation fails locally too -
      # an architecture that is only documented is one that gets violated in week three.
      - name: Architecture rules
        run: ./gradlew :test:arch:test --stacktrace

      # The native mandate's own checks (§2). Cheap, file-reading, and each one caught a
      # real defect during phase 2a — see docs/native-dependencies.md §1.3. They also run
      # in their own workflow so a vendoring mistake is not gated behind AGP.
      - name: Vendored trees are complete, pinned and unmodified (N-2, N-7, N-10)
        run: |
          ./tools/vendor/verify-pins.sh
          ./tools/vendor/verify-vendored.sh
          ./tools/vendor/verify-openssl-prune.sh
          ./tools/vendor/verify-prune.sh
          ./tools/vendor/verify-guarded-prunes.sh
          ./tools/vendor/verify-tensorflow-keep.sh
          ./tools/vendor/verify-no-fetch.sh

      # Task 3 done-when #2: "zero warnings suppressed by baseline abuse".
      # A baseline file is how suppressed findings quietly become permanent.
      # Task 13 done-when #2: CI must FAIL if an architecture rule is violated. Planting
      # a violation and requiring the failure is the only way to know the gate is live -
      # the same discipline as the :domain and android.util.Log negative tests.
      - name: Assert the architecture rules gate the build
        run: |
          PROBE=domain/src/main/kotlin/com/whatsappv2/domain/ArchProbe.kt
          printf 'package com.whatsappv2.domain\n\nimport android.content.Context\n\nclass ArchProbe(val c: Context)\n' > "$PROBE"
          if ./gradlew :test:arch:test -q >/dev/null 2>&1; then
            rm -f "$PROBE"
            echo "::error::The architecture rules did NOT fail on an Android import in :domain."
            exit 1
          fi
          rm -f "$PROBE"
          echo "OK - an architecture violation fails the build."

      - name: Assert no detekt or lint baseline files
        run: |
          found=$(find . -type f \
                    \( -name "detekt-baseline*.xml" -o -name "lint-baseline.xml" -o -name "baseline.xml" \) \
                    -not -path "./.git/*" || true)
          if [ -n "$found" ]; then
            echo "::error::Baseline files found — fix the findings instead of baselining them:"
            echo "$found"
            exit 1
          fi
          echo "OK — no baselines."

      # Task 32 done-when #4: no hostname, credential, or certificate is committed.
      #
      # Checked on tracked files rather than the working tree, because that is what the
      # requirement is about — a secret that reached git is disclosed even after the commit
      # that removed it. Scoped to properties files and certificate extensions so the
      # worked example in docs/testing.md is not mistaken for a real target.
      - name: Assert no test target is committed
        run: |
          # Scoped to THIS project's own files. `third_party/` is excluded, and the
          # exclusion is safe for a specific reason rather than by assumption:
          #
          # Vendoring OpenSSL brings in 48 sample certificates and keys under
          # `third_party/openssl/apps/` — ca-key.pem, server.pem, dsa1024.pem and the rest.
          # They are upstream's public test fixtures, published in every OpenSSL release
          # since the 1990s, and they are not secrets of ours.
          #
          # What makes skipping them safe is not that they look harmless. It is that
          # architecture **rule 12** hashes every vendored tree against a recorded manifest,
          # so the contents of `third_party/` are provably upstream's bytes and not
          # something somebody slipped in. A secret cannot hide there without changing a
          # hash and failing the build. Without rule 12 this exclusion would be a hole.
          ours() { git ls-files "$@" | grep -v '^third_party/' || true; }

          bad=$(ours '*.properties' | xargs -r grep -l -E '^[[:space:]]*sip\.test\.' || true)
          if [ -n "$bad" ]; then
            echo "::error::A properties file in the repo sets sip.test.* — those belong in ~/.gradle/gradle.properties or a CI secret:"
            echo "$bad"
            exit 1
          fi

          certs=$(ours | grep -E '\.(pem|p12|jks|keystore|crt|key)$' || true)
          if [ -n "$certs" ]; then
            echo "::error::A certificate or keystore is committed:"
            echo "$certs"
            exit 1
          fi
          echo "OK - no host, credential or certificate outside the vendored trees."

      # Task 2 done-when #2: no Groovy build files anywhere.
      - name: Assert no Groovy build files
        run: |
          # -type f matters: the Gradle cache DIRECTORY is literally named `.gradle`,
          # and the glob `*.gradle` matches it (the `*` matches an empty string).
          # Without -type f this assertion fails on every build that has run once.
          # `third_party/` is excluded here and in the assertions below. These check THIS
          # project's conventions — Kotlin DSL, no inline versions, no permissive
          # TrustManager — and upstream's code is not subject to them. pjproject ships
          # eight Groovy `build.gradle` files for its sample apps; that is upstream's
          # choice and none of them is built here.
          #
          # Safe because architecture rule 12 hashes every vendored tree against a
          # recorded manifest, so `third_party/` provably contains upstream's bytes.
          # Without that hash this exclusion would be a place to hide things.
          found=$(find . -type f -name "*.gradle" \
                    -not -path "./.git/*" \
                    -not -path "./third_party/*" \
                    -not -path "*/.gradle/*" \
                    -not -path "*/build/*" || true)
          if [ -n "$found" ]; then
            echo "::error::Groovy build files found (Kotlin DSL only):"
            echo "$found"
            exit 1
          fi
          echo "OK — Kotlin DSL only."

      # Task 2 done-when #3: every version lives in the catalog.
      - name: Assert no inline dependency versions
        run: |
          bad=$(grep -rnE '(implementation|api|classpath|compileOnly|runtimeOnly|ksp|kapt)\s*\(?["'"'"'][^"'"'"']+:[^"'"'"']+:[0-9]' \
                  --include="*.gradle.kts" --exclude-dir=third_party . || true)
          if [ -n "$bad" ]; then
            echo "::error::Inline dependency versions found — they belong in gradle/libs.versions.toml:"
            echo "$bad"
            exit 1
          fi
          echo "OK — all versions come from the version catalog."

      # Task 4 done-when #2 — cheap structural check, run before the expensive one.
      - name: Assert :domain applies no Android plugin
        run: |
          if grep -qE 'whatsappv2\.android|com\.android\.|^\s*android\s*\{' domain/build.gradle.kts; then
            echo "::error:::domain must stay a pure JVM module (§4.1, DoD 2)."
            cat domain/build.gradle.kts
            exit 1
          fi
          echo "OK — :domain applies no Android plugin."

      # Task 4 done-when #3 — the boundary must be enforced by the BUILD, not by
      # convention. A JVM library cannot consume an AAR, so this must fail.
      # Task 4 done-when #3 — the boundary must be enforced by the BUILD, not by
      # convention. A JVM library cannot consume an AAR, so this must fail.
      #
      # Written with printf rather than a heredoc: a heredoc terminator must sit at
      # column 0, which terminates the surrounding YAML block scalar and makes the
      # whole workflow file invalid.
      - name: Assert :domain rejects an Android dependency
        run: |
          cp domain/build.gradle.kts "$RUNNER_TEMP/domain.bak"
          printf '\ndependencies {\n    implementation("androidx.core:core-ktx:1.19.0")\n}\n' \
            >> domain/build.gradle.kts
          if ./gradlew :domain:build -q >/dev/null 2>&1; then
            cp "$RUNNER_TEMP/domain.bak" domain/build.gradle.kts
            echo "::error:::domain accepted an Android dependency - the layer boundary is NOT enforced."
            exit 1
          fi
          cp "$RUNNER_TEMP/domain.bak" domain/build.gradle.kts
          echo "OK - :domain rejects Android dependencies at build time."

      # Task 5 done-when #2 — the ban on android.util.Log must be ENFORCED, not just
      # configured. Plant a violation in a module that is not exempt and require detekt
      # to fail. Uses a here-string via printf: a heredoc terminator at column 0 would
      # break the surrounding YAML block scalar.
      - name: Assert android.util.Log is rejected outside the logging facade
        run: |
          PROBE=data/sip/src/main/kotlin/com/whatsappv2/data/sip/LogProbe.kt
          mkdir -p "$(dirname "$PROBE")"
          printf 'package com.whatsappv2.data.sip\n\nimport android.util.Log\n\nobject LogProbe {\n    fun leak() {\n        Log.d("probe", "should be rejected")\n    }\n}\n' > "$PROBE"
          if ./gradlew :data:sip:detekt -q >/dev/null 2>&1; then
            rm -f "$PROBE"
            echo "::error::detekt accepted android.util.Log outside the facade - the ban is NOT enforced (Task 5, DoD 12)."
            exit 1
          fi
          rm -f "$PROBE"
          echo "OK - android.util.Log is rejected outside the logging facade."

      # Task 5 done-when #3 depends on BOTH variant loggers existing. A stray
      # "release/" entry in .gitignore once silenced the release one entirely, so the
      # release build had no logger and the guarantee was quietly absent.
      - name: Assert both variant loggers are tracked
        run: |
          missing=0
          for v in debug release; do
            f="app/src/$v/java/com/whatsappv2/logging/PlatformLogger.kt"
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is not tracked by git - is it caught by .gitignore?"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "OK - both variant loggers are tracked."
          exit $missing

      - name: Assert the release logger stays silent below warn (Task 63, DoD 12)
        run: |
          # Release builds must emit no SIP messages, headers, credentials, phone numbers
          # or contact data. The guarantee is structural rather than a runtime level check:
          # verbose, debug and info have empty bodies in the release variant, so R8 removes
          # the call sites entirely. A level check would leave the strings in the binary.
          f=app/src/release/java/com/whatsappv2/logging/PlatformLogger.kt
          for method in verbose debug info; do
            grep -qE "override fun $method\(tag: String, message: String\) = Unit" "$f" || {
              echo "::error::$f no longer discards $method(). Release builds would emit it."
              exit 1
            }
          done
          echo "The release logger discards verbose, debug and info by construction."

      - name: Assert the credential screen is marked secure (Tasks 21, 63)
        run: |
          # A SIP password is typed on exactly one screen, and a screenshot or a screen
          # recorder would carry it off the device past every other protection §7 applies.
          editor=feature/accounts/src/main/kotlin/com/whatsappv2/feature/accounts/editor/AccountEditorScreen.kt
          grep -qF 'SecureScreen()' "$editor" || {
            echo "::error::$editor no longer calls SecureScreen(). See Task 21 done-when #3."
            exit 1
          }
          echo "The account editor marks its window secure."

      - name: Assert no credential is interpolated into a log line (Task 63, DoD 12)
        run: |
          # Narrow on purpose. A grep cannot tell a safe log line from an unsafe one in
          # general, but it can catch the specific mistake worth catching: a variable
          # whose NAME says it is a secret, interpolated straight into a message.
          hits=$(grep -rnE '(verbose|debug|info|warn|error)\(.*\$\{?[A-Za-z.]*(password|secret|credential|token|passphrase)' \
                   --include='*.kt' --exclude-dir=build --exclude-dir=.git . || true)
          if [ -n "$hits" ]; then
            echo "::error::A credential-named value is interpolated into a log call (§7, DoD 12)."
            echo "$hits"
            exit 1
          fi
          echo "No credential-named value reaches a log call."

      - name: Assert no permissive TrustManager (Task 62, DoD 13)
        run: |
          # §7 forbids a permissive TrustManager outright, and the usual way one arrives is
          # a debug helper that outlives the debugging. This looks for the shape rather
          # than for a name: a checkServerTrusted anywhere in this repository is worth a
          # human reading it, and there are currently none.
          hits=$(grep -rn --include='*.kt' --include='*.java' \
                   --exclude-dir=build --exclude-dir=.git \
                   -e 'checkServerTrusted' \
                   -e 'checkClientTrusted' \
                   -e 'X509TrustManager' \
                   -e 'ALLOW_ALL_HOSTNAME_VERIFIER' \
                   -e 'setHostnameVerifier' \
                   . || true)
          if [ -n "$hits" ]; then
            echo "::error::A TrustManager or hostname verifier was found. §7 forbids overriding certificate validation."
            echo "$hits"
            exit 1
          fi
          echo "No TrustManager override anywhere in the tree."

      - name: Assert certificate validation is never switched off (Task 62, P-8)
        run: |
          # The SIP stack runs its own TLS, so `network_security_config.xml` never sees it.
          # `TlsConfig.verifyServer` is the equivalent, and it must be unconditional.
          #
          # Until 2026-09-08 this named the previous stack's gateway - a file ADR-006
          # deleted. It never failed, because `./gradlew build` compiles before these
          # steps run and the compile had failed since the migration. A security gate
          # pointing at a file that does not exist is not a lenient gate, it is an absent
          # one, so the first thing it now checks is that its own targets are real.
          gateway=data/sip/src/main/kotlin/com/whatsappv2/data/sip/registration/stack/RealPjsipCoreGateway.kt
          store=data/sip/src/main/kotlin/com/whatsappv2/data/sip/registration/stack/PjsipTrustStore.kt

          for f in "$gateway" "$store"; do
            [ -f "$f" ] || {
              echo "::error::$f does not exist, so this assertion is checking nothing."
              exit 1
            }
          done

          grep -qF 'verifyServer = true' "$gateway" || {
            echo "::error::$gateway no longer turns TLS server verification on."
            exit 1
          }

          # Both halves, because either alone is useless. OpenSSL is built here with no
          # default CA store, so verifyServer without a caListFile rejects every
          # certificate rather than accepting them - which reads as "TLS is broken" and
          # gets fixed by turning verification back off.
          grep -qF 'caListFile' "$gateway" || {
            echo "::error::$gateway verifies certificates but supplies no CA list."
            exit 1
          }

          if grep -rnE 'verifyServer\s*=\s*false' data/sip/src/main; then
            echo "::error::TLS server verification is switched off somewhere in :data:sip."
            exit 1
          fi

          echo "The SIP stack validates certificates unconditionally, against a CA bundle."

      - name: Assert cleartext traffic is refused (Task 62)
        run: |
          manifest=app/src/main/AndroidManifest.xml
          config=app/src/main/res/xml/network_security_config.xml
          grep -qF 'android:usesCleartextTraffic="false"' "$manifest" || {
            echo "::error::$manifest no longer sets usesCleartextTraffic=false"
            exit 1
          }
          grep -qF 'cleartextTrafficPermitted="false"' "$config" || {
            echo "::error::$config no longer refuses cleartext"
            exit 1
          }
          # A debug-overrides block is how a permissive trust configuration reaches
          # production: added to unblock an afternoon's testing, never removed.
          #
          # Read the markup with XML comments stripped. The config's own header names the
          # element in order to explain why it is absent, so a plain grep fails on the
          # documentation of the very rule it is enforcing.
          python3 - "$config" <<'PY'
          import re, sys
          path = sys.argv[1]
          markup = re.sub(r"<!--.*?-->", "", open(path, encoding="utf-8").read(), flags=re.S)
          if "debug-overrides" in markup:
              print(f"::error::{path} contains a debug-overrides block. See its own comment for why not.")
              sys.exit(1)
          PY
          echo "Cleartext is refused in every build, with no debug override."

      - name: Coverage
        run: ./gradlew koverXmlReport koverHtmlReport --stacktrace

      # Task 5 done-when #1: the Outcome type must be >= 95% line-covered.
      # Task 68 will extend this to >= 80% across :domain and :data:*.
      - name: Assert coverage thresholds
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          # package path -> minimum line coverage percent
          THRESHOLDS = {
              "com/whatsappv2/core/common/result": 95,
              "com/whatsappv2/domain/model": 95,
              "com/whatsappv2/domain/validation": 95,
              "com/whatsappv2/domain/usecase": 85,
              "com/whatsappv2/domain/registration": 95,
              "com/whatsappv2/service": 90,
              # Feature packages hold Compose composables alongside their ViewModel and
              # state. Line coverage of declarative UI is a weak signal - a composable can
              # be 100% "covered" by rendering once and asserting nothing - so these are
              # held to a floor that proves the screen renders and its logic is exercised,
              # while the real verification is the UI tests themselves.
              "com/whatsappv2/feature/accounts/editor": 45,
              "com/whatsappv2/feature/accounts/list": 40,
              "com/whatsappv2/feature/settings": 40,

              "com/whatsappv2/domain/call": 95,
              "com/whatsappv2/domain/engine": 95,
              "com/whatsappv2/core/common/secret": 100,
              "com/whatsappv2/core/common/time": 95,
              # Test support, held to a floor rather than the production bar: its
              # uncovered lines are error paths no test needs to exercise.
              "com/whatsappv2/domain/testing": 90,
              # 85, not higher: the residue is interface declarations plus a platform
              # error branch that could not be triggered on the JVM. Every substantive
              # path - round trip, IV uniqueness, tampering, key loss - is covered.
              "com/whatsappv2/data/account/crypto": 85,
              "com/whatsappv2/data/account/db": 85,
              "com/whatsappv2/data/account": 80,
              "com/whatsappv2/data/account/mapper": 80,
              # The placeholder engine is temporary (replaced in Task 27) and a few of
              # its lines - property initialisers, a no-op shutdown - are not reachable
              # from a test. Its behaviour is what matters and is fully asserted.
              # 65, stated rather than chased: the substantive paths - round trip,
              # persistence proven by reading a copy of the file, per-setting isolation,
              # every enum value, and the corrupt-file fallback - are all covered. The
              # residue is defensive branches DataStore does not expose a way to trigger.
              "com/whatsappv2/data/settings": 65,
              # The SDK-touching classes live in .../stack packages and are ungated:
              # PJSIP cannot run on the JVM, so they are verified on-device from
              # Task 33. Gating them here would only lower the bar for the code that CAN
              # be tested.
              "com/whatsappv2/data/sip": 80,
              "com/whatsappv2/data/sip/registration": 90,
              # Network-change recovery (Task 30). The ConnectivityManager half lives in
              # .../network/platform and is ungated for the same reason as .../stack: it
              # needs a device. The coordinator beside it does not, and is held to the
              # same bar as the rest of the module.
              "com/whatsappv2/data/sip/network": 85,

              # Call recording (Task 58). The consent gate and the retention hook are pure
              # decisions and are held to the domain bar. EncryptedRecordingStore lives in
              # .../recording/stack and is ungated for the same reason as .../stack and
              # .../network/platform: the Android Keystore does not run on the JVM, so its
              # round trip is verified on a device. What IS gated here is the part that
              # decides whether a recording may start at all, which is where §2.6 lives.
              "com/whatsappv2/domain/recording": 90,
              "com/whatsappv2/data/sip/recording": 85,
          }

          reports = glob.glob("**/build/reports/kover/report.xml", recursive=True)
          if not reports:
              print("::error::No Kover XML report found - the coverage step produced nothing.")
              sys.exit(1)
          print("reports:", reports)

          # Generated code is not code anyone wrote, and measuring it says nothing about
          # whether the project is tested. Dagger factories, Hilt components and Room _Impl
          # classes were inflating - and in one case failing - real packages.
          GENERATED = (
              "_Factory.java", "_MembersInjector.java", "_Impl.java", "_Impl.kt",
              "_HiltModules.java", "_GeneratedInjector.java", "_ComponentTreeDeps.java",
          )

          def is_generated(source_name):
              return source_name.startswith("Hilt_") or source_name.endswith(GENERATED)

          # Framework-driven classes, not measured here - the same call as ungating
          # .../stack and .../network/platform, and made for the same reason: counting a
          # class no JVM test drives does not measure it, it only drags down the bar for
          # the code beside it. com/whatsappv2/service read 44.9% while ServiceRunPolicy,
          # which holds every run/stop decision, had no uncovered line at all.
          #
          # Say plainly what this is: RegistrationService is UNTESTED, not untestable.
          # Robolectric can drive a Service, unlike the SIP stack. Until something does, its
          # behaviour is verified on-device, and the 90% below is a real bar on the pure
          # classes rather than an unreachable one on the package. Anything added here
          # needs the same justification in writing.
          NOT_MEASURED_HERE = ("RegistrationService.kt",)

          def is_excluded(source_name):
              return is_generated(source_name) or source_name in NOT_MEASURED_HERE

          totals = {}
          for path in reports:
              for pkg in ET.parse(path).getroot().iter("package"):
                  name = pkg.get("name", "")
                  for sf in pkg.findall("sourcefile"):
                      if is_excluded(sf.get("name", "")):
                          continue
                      for c in sf.findall("counter"):
                          if c.get("type") == "LINE":
                              missed, covered = int(c.get("missed", 0)), int(c.get("covered", 0))
                              m, cv = totals.get(name, (0, 0))
                              totals[name] = (m + missed, cv + covered)

          failed = False
          rows = []
          for name, (missed, covered) in sorted(totals.items()):
              total = missed + covered
              pct = 100.0 * covered / total if total else 100.0
              required = THRESHOLDS.get(name)
              flag = ""
              if required is not None:
                  flag = f"  (required >= {required}%)"
                  if pct < required:
                      print(f"::error::{name} line coverage {pct:.1f}% < {required}%")
                      failed = True
              print(f"{pct:6.1f}%  {covered:5d}/{total:-5d}  {name}{flag}")
              rows.append((name, pct, covered, total, required))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### Coverage\n\n")
                  fh.write("| Package | Line coverage | Covered / total | Gate |\n")
                  fh.write("|---|---:|---:|---:|\n")
                  for name, pct, covered, total, required in rows:
                      gate = f"{required}%" if required is not None else "-"
                      mark = "" if required is None or pct >= required else " :x:"
                      fh.write(f"| `{name}` | {pct:.1f}%{mark} | {covered}/{total} | {gate} |\n")
                  fh.write("\nFull HTML reports are in the **coverage** artifact.\n\n")

          for name in THRESHOLDS:
              if name not in totals:
                  print(f"::error::No coverage data for {name} - is the package name right?")
                  failed = True

          if failed:
              print("\n--- uncovered lines in threshold packages ---")
              for path in reports:
                  for pkg in ET.parse(path).getroot().iter("package"):
                      if pkg.get("name", "") not in THRESHOLDS:
                          continue
                      for sf in pkg.findall("sourcefile"):
                          if is_excluded(sf.get("name", "")):
                              continue
                          missed = [ln.get("nr") for ln in sf.findall("line")
                                    if int(ln.get("mi", 0)) > 0]
                          if missed:
                              print(f"  {sf.get('name')}: lines {', '.join(missed)}")
          sys.exit(1 if failed else 0)
          PY

      # Coverage is a deliverable, not just a gate: Task 68 has to report real measured
      # numbers, and a report that only exists inside a log line cannot be reviewed.
      - name: Publish coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            **/build/reports/kover/**
          if-no-files-found: error
          retention-days: 30

      # Room exports the schema during the build. It must be COMMITTED: Room compares
      # against the committed copy to verify a migration, so an uncommitted schema change
      # ships as silent data loss instead of a build failure.
      - name: Assert the exported Room schema is committed
        run: |
          if [ -z "$(find . -path '*/schemas/*.json' -print -quit)" ]; then
            echo "::error::No Room schema was exported - schema export is not working."
            exit 1
          fi
          # ':(glob)' magic is required - a plain '**/schemas' pathspec matches nothing
          # in git, so these checks passed vacuously on their first run.
          if ! git diff --quiet -- ':(glob)**/schemas/**'; then
            echo "::error::The exported Room schema differs from the committed one."
            echo "Commit the regenerated schema - Room needs it to verify migrations."
            git diff --stat -- ':(glob)**/schemas/**'
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- ':(glob)**/schemas/**')
          if [ -n "$untracked" ]; then
            echo "::error::An exported Room schema is not tracked by git:"
            echo "$untracked"
            exit 1
          fi
          echo "tracked schemas:"
          git ls-files -- ':(glob)**/schemas/**' | sed 's/^/  /'
          echo "OK - the committed schema matches what the build exported."

      - name: Publish the exported Room schema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas-${{ github.sha }}
          path: "**/schemas/**/*.json"
          if-no-files-found: warn
          retention-days: 7

      # §3: every bundled .so must be 16 KB page-size aligned. Recent Android refuses to
      # load one that is not, and the failure appears as a crash on a specific device
      # rather than as anything the build said. Checked here so it is a build failure.
      - name: Assert native libraries are 16 KB page-size aligned
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK to inspect."
            exit 1
          fi

          WORK="$RUNNER_TEMP/apk-so"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q -o "$APK" 'lib/*' -d "$WORK" || true

          mapfile -t LIBS < <(find "$WORK" -name "*.so" 2>/dev/null)
          if [ "${#LIBS[@]}" -eq 0 ]; then
            echo "No native libraries in the APK - nothing to align."
            exit 0
          fi
          echo "Found ${#LIBS[@]} native library(ies)"

          # The ABI filter in :app is a claim about what ships. Check it: an unfiltered
          # SIP stack drops four ABIs of native code into the APK, and nothing else in
          # the build would say so.
          EXPECTED="arm64-v8a armeabi-v7a x86_64"
          ACTUAL=$(find "$WORK/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort | tr '\n' ' ' | sed 's/ $//')
          WANT=$(printf '%s\n' $EXPECTED | sort | tr '\n' ' ' | sed 's/ $//')
          echo "ABIs packaged: $ACTUAL"
          if [ "$ACTUAL" != "$WANT" ]; then
            echo "::error::APK packages ABIs [$ACTUAL]; :app declares [$WANT]."
            exit 1
          fi

          READELF=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf 2>/dev/null | head -1)
          if [ -z "$READELF" ]; then
            READELF=$(command -v llvm-readelf || command -v readelf)
          fi
          if [ -z "$READELF" ]; then
            echo "::error::No readelf available to verify alignment."
            exit 1
          fi

          # 16 KB pages are a 64-bit concern, so this is a 64-bit assertion.
          #
          # Every device that ships with 16 KB pages is 64-bit-only, and a 32-bit process
          # is 4 KB-paged on every device that has ever existed. So armeabi-v7a is built
          # at 0x1000 by everyone shipping a SIP stack, and always will be. Requiring
          # 0x4000 of it does not protect anything - it just asserts that the SIP stack
          # is broken, which is what run 33953349572 did to all 13 of its libraries while
          # all 32 of the 64-bit ones passed.
          ALIGNED_ABIS="arm64-v8a x86_64"

          BAD=0
          CHECKED=0
          for lib in "${LIBS[@]}"; do
            ABI=$(basename "$(dirname "$lib")")
            # A 16 KB-compatible library has LOAD segments aligned to 0x4000 or more.
            ALIGN=$("$READELF" -lW "$lib" 2>/dev/null | awk '/LOAD/ {print $NF}' | sort -u | head -1)
            case " $ALIGNED_ABIS " in
              *" $ABI "*) ;;
              *)
                echo "  n/a  $ALIGN  $ABI/$(basename "$lib")  (32-bit, always 4 KB-paged)"
                continue
                ;;
            esac
            CHECKED=$((CHECKED + 1))
            case "$ALIGN" in
              0x4000|0x10000|0x40000) STATUS="ok" ;;
              *) STATUS="MISALIGNED"; BAD=1 ;;
            esac
            echo "  $STATUS  $ALIGN  $ABI/$(basename "$lib")"
          done

          if [ "$BAD" -ne 0 ]; then
            echo "::error::A 64-bit native library is not 16 KB page-size aligned (§3)."
            exit 1
          fi

          # An assertion that examined nothing passes for the wrong reason. If the ABI
          # filter or the ABI names ever change, this is what says so.
          if [ "$CHECKED" -eq 0 ]; then
            echo "::error::No 64-bit native library was examined - checked ABIs [$ALIGNED_ABIS] against a build that packages [$ACTUAL]."
            exit 1
          fi
          echo "OK - all $CHECKED 64-bit native libraries are 16 KB page-size aligned."

      # ---------------------------------------------------------------- APK
      # Every push produces a downloadable, installable debug APK. Debug, not release:
      # a release build needs a signing keystore, and keystores are not something CI
      # should hold or this repo should carry.
      # And it produces one that can PLACE A CALL, which until now it did not.
      # `pjsip/libs/pjsua2.aar` is gitignored - 20 MB of native code does not belong in
      # git - so a bare checkout falls back to `:pjsip:api`, the SWIG-generated Java API
      # with no `.so` behind it. That APK compiled, installed, launched, and died on the
      # first SIP call with UnsatisfiedLinkError. It was a compile gate wearing the name
      # of a deliverable, and it cost a debugging session to notice.

      - name: Restore the pjsua2 AAR from cache
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: pjsip/libs/pjsua2.aar
          # Keyed on the workflow that produces it, so bumping pjproject, OpenSSL, Opus
          # or libvpx - all pinned in that file - invalidates this automatically. There
          # is no second place to remember to edit.
          key: pjsua2-aar-${{ hashFiles('.github/workflows/build-pjsip.yml') }}

      # Self-healing: on a cache miss, take the AAR from the last green native build
      # rather than failing and waiting for somebody to notice. The cache holds it for
      # later runs, so this costs ~20s once per invalidation rather than the ~10 minutes
      # a native rebuild would.
      - name: Fetch the pjsua2 AAR from the last green native build
        if: steps.aar-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
                      --workflow "Build PJSIP for Android" \
                      --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful 'Build PJSIP for Android' run to take an AAR from."
            echo "Run that workflow once, then re-run this job."
            exit 1
          fi

          # By prefix, not by a hardcoded version: the artifact is named after the
          # pjproject tag, and pinning it here would be the second place to edit.
          name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                    -q '.artifacts[].name' | grep '^pjsua2-aar-' | head -1)"
          if [ -z "$name" ]; then
            echo "::error::Run $run_id produced no pjsua2-aar-* artifact."
            exit 1
          fi

          echo "taking $name from run $run_id"
          mkdir -p pjsip/libs aar-download
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$name" -D aar-download
          cp aar-download/pjsua2-*.aar pjsip/libs/pjsua2.aar

      # The AAR is what makes the difference, so prove it is intact before building
      # against it. A truncated or wrong-wrapper AAR fails at run time on a handset,
      # which is the most expensive place to find out.
      - name: Verify the AAR carries the JNI wrapper
        run: |
          set -euo pipefail
          aar=pjsip/libs/pjsua2.aar
          test -f "$aar" || { echo "::error::$aar is missing"; exit 1; }
          echo "AAR: $(du -h "$aar" | cut -f1)"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libpjsua2.so libc++_shared.so; do
              unzip -l "$aar" | grep -q "jni/$abi/$lib" \
                || { echo "::error::$aar is missing jni/$abi/$lib"; exit 1; }
            done
          done

          # pjproject builds three libpjsua2.so - Java, maui and xamarin - and they are
          # indistinguishable by name, size, ABI and alignment. Only the exports differ.
          unzip -o -q "$aar" jni/arm64-v8a/libpjsua2.so -d aar-check
          LC_ALL=C grep -aq "Java_org_pjsip_pjsua2_pjsua2JNI_swig_1module_1init" \
            aar-check/jni/arm64-v8a/libpjsua2.so \
            || { echo "::error::the AAR's wrapper exports no pjsua2JNI symbols"; exit 1; }
          rm -rf aar-check
          echo "OK - all three ABIs present, wrapper is the JNI one."

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The check that would have caught the whole PJSIP episode on day one. An APK
      # without these installs cleanly, launches, and dies on the first SIP call.
      - name: Assert the APK carries the native SIP stack
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          [ -n "$apk" ] || { echo "::error::no APK was produced"; exit 1; }

          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libpjsua2.so libc++_shared.so; do
              if unzip -l "$apk" | grep -q "lib/$abi/$lib"; then
                echo "  ok       lib/$abi/$lib"
              else
                echo "  MISSING  lib/$abi/$lib"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::This APK cannot place a call - the native stack is absent."
            exit 1
          fi
          echo "OK - all three ABIs carry the SIP stack and its C++ runtime."

      - name: Report APK size
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "APK: $APK"
          echo "Size: $(du -h "$APK" | cut -f1)"
          {
            echo "### Debug APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$APK")\` |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this run."
            echo ""
            echo "> Carries the PJSIP native stack for all three ABIs, verified by the"
            echo "> step above. This APK can register and place calls."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: whatsapp-v2-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build minified release APK (Task 64, DoD 1)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Assert R8 actually ran and produced a mapping (Task 64)
        run: |
          # A release build that silently skipped minification is a release build nobody
          # has tested the shape of - and the mapping file is the only way a crash from
          # one is ever deobfuscated. Both are checked rather than assumed.
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ ! -s "$mapping" ]; then
            echo "::error::No mapping file at $mapping. Did minification get switched off?"
            exit 1
          fi

          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$apk" ]; then
            echo "::error::assembleRelease produced no APK."
            exit 1
          fi

          debug=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          {
            echo "### Release APK (minified)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$apk")\` |"
            echo "| Size | $(du -h "$apk" | cut -f1) |"
            if [ -n "$debug" ]; then
              echo "| Debug APK, for comparison | $(du -h "$debug" | cut -f1) |"
            fi
            echo "| Mapping | $(wc -l < "$mapping") lines |"
            echo ""
            echo "> Unsigned on purpose: a keystore in git is a compromised keystore."
            echo "> A release pipeline signs this with credentials it holds itself."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "R8 ran; mapping is $(wc -l < "$mapping") lines."

      - name: Upload the R8 mapping file (Task 64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Retained because a crash report from a release build is undecipherable without
          # it, and the build that produced it may be long gone by the time one arrives.
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 7

  # ------------------------------------------------------------------ security
  # §7: "run a vulnerability check in CI". Resolves the REAL dependency tree - not
  # just the direct entries in the version catalog - and queries OSV.dev, which
  # aggregates GitHub Advisories and the CVE feeds.
  #
  # Written against the OSV HTTP API rather than a scanner action: the query and the
  # failure condition are both visible here, so a green result means something
  # specific rather than "some action exited zero".
  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure the Android platform this build compiles against is present
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          COMPILE_SDK=$(grep -E '^compileSdk' gradle/libs.versions.toml | grep -oE '[0-9]+')
          if compgen -G "$SDK/platforms/android-$COMPILE_SDK" > /dev/null ||
             compgen -G "$SDK/platforms/android-$COMPILE_SDK.*" > /dev/null; then
            echo "OK - a platform for API $COMPILE_SDK is already installed."
            exit 0
          fi
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$COMPILE_SDK"

      - name: Resolve the runtime dependency tree
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > deps.txt

      - name: Query OSV.dev
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          # Gradle prints "group:name:version", sometimes with a conflict resolution
          # "-> version". The resolved version is what actually ships, so it wins.
          COORD = re.compile(
              r"([A-Za-z0-9_.\-]+):([A-Za-z0-9_.\-]+):"
              r"([A-Za-z0-9_.\-+]+)(?:\s*->\s*([A-Za-z0-9_.\-+]+))?"
          )

          packages = {}
          for line in open("deps.txt"):
              if "project :" in line:
                  continue
              m = COORD.search(line)
              if m:
                  group, name, declared, resolved = m.groups()
                  packages[(f"{group}:{name}", resolved or declared)] = True

          coords = sorted(packages)
          print(f"Resolved {len(coords)} unique dependencies")
          if not coords:
              print("::error::No dependencies parsed - the scan would pass vacuously.")
              sys.exit(1)

          allow = set()
          path = ".github/osv-allowlist.txt"
          if os.path.exists(path):
              for line in open(path):
                  entry = line.split("#")[0].strip()
                  if entry:
                      allow.add(entry)

          findings = []
          CHUNK = 500
          for i in range(0, len(coords), CHUNK):
              batch = coords[i:i + CHUNK]
              body = json.dumps({
                  "queries": [
                      {"package": {"name": n, "ecosystem": "Maven"}, "version": v}
                      for n, v in batch
                  ]
              }).encode()
              req = urllib.request.Request(
                  "https://api.osv.dev/v1/querybatch",
                  data=body,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  results = json.load(resp).get("results", [])
              for (name, version), result in zip(batch, results):
                  for vuln in result.get("vulns", []) or []:
                      if vuln["id"] not in allow:
                          findings.append((name, version, vuln["id"]))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if findings:
              print(f"::error::{len(findings)} known vulnerability(ies) in dependencies")
              for name, version, vid in findings:
                  print(f"  {name}:{version}  {vid}  https://osv.dev/vulnerability/{vid}")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("### Vulnerable dependencies\n\n")
                      fh.write("| Dependency | Version | Advisory |\n|---|---|---|\n")
                      for name, version, vid in findings:
                          fh.write(f"| `{name}` | {version} | [{vid}](https://osv.dev/vulnerability/{vid}) |\n")
              sys.exit(1)

          print(f"OK - no known vulnerabilities across {len(coords)} dependencies.")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(f"### Dependency vulnerabilities\n\nNone across {len(coords)} resolved dependencies.\n\n")
          PY
