# CI gate. Per ADR-005 this runs entirely on hosted runners and must stay green
# WITHOUT reachability to the FreeSWITCH server — server-backed integration tests
# are a separate, scheduled workflow added in Task 32.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify the Gradle wrapper is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing. Run the 'Bootstrap Gradle wrapper' workflow first."
            exit 1
          fi

      # Checks the wrapper jar against Gradle's published checksums — the jar is a
      # binary committed to the repo, so its provenance is verified, not trusted.
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v4

      # A workflow with invalid YAML never runs, so it cannot validate itself — but it
      # can validate its siblings. This caught a heredoc terminator at column 0 that
      # silently broke the whole file.
      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(f))
                  print(f"ok   {f}")
              except yaml.YAMLError as e:
                  bad.append(f); print(f"FAIL {f}: {e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # API 37 ships as MINOR-versioned platforms (android-37.0, android-37.1,
      # android-37.2) - there is no plain "android-37" directory, so an exact-match
      # check finds nothing even when the platform is installed.
      - name: Ensure the Android platform this build compiles against is present
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          COMPILE_SDK=$(grep -E '^compileSdk' gradle/libs.versions.toml | grep -oE '[0-9]+')
          echo "compileSdk from the version catalog: $COMPILE_SDK"
          echo "installed platforms:"
          ls -1 "$SDK/platforms" 2>/dev/null | sort -V | sed 's/^/  /' || echo "  (none)"

          if compgen -G "$SDK/platforms/android-$COMPILE_SDK" > /dev/null ||
             compgen -G "$SDK/platforms/android-$COMPILE_SDK.*" > /dev/null; then
            echo "OK - a platform for API $COMPILE_SDK is already installed."
            exit 0
          fi

          echo "installing platforms;android-$COMPILE_SDK"
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$COMPILE_SDK"
          ls -1 "$SDK/platforms" | sort -V

      - name: Build
        # warningsAsErrors is CI-only: locally a deprecation warning should not stop
        # work, but in CI warnings must not be allowed to accumulate.
        run: ./gradlew build --stacktrace -PwarningsAsErrors=true

      - name: Static analysis
        run: ./gradlew detekt lint --stacktrace

      # Task 12: the layer rules run in the build, so a violation fails locally too -
      # an architecture that is only documented is one that gets violated in week three.
      - name: Architecture rules
        run: ./gradlew :test:arch:test --stacktrace

      # Task 3 done-when #2: "zero warnings suppressed by baseline abuse".
      # A baseline file is how suppressed findings quietly become permanent.
      # Task 13 done-when #2: CI must FAIL if an architecture rule is violated. Planting
      # a violation and requiring the failure is the only way to know the gate is live -
      # the same discipline as the :domain and android.util.Log negative tests.
      - name: Assert the architecture rules gate the build
        run: |
          PROBE=domain/src/main/kotlin/com/whatsappv2/domain/ArchProbe.kt
          printf 'package com.whatsappv2.domain\n\nimport android.content.Context\n\nclass ArchProbe(val c: Context)\n' > "$PROBE"
          if ./gradlew :test:arch:test -q >/dev/null 2>&1; then
            rm -f "$PROBE"
            echo "::error::The architecture rules did NOT fail on an Android import in :domain."
            exit 1
          fi
          rm -f "$PROBE"
          echo "OK - an architecture violation fails the build."

      - name: Assert no detekt or lint baseline files
        run: |
          found=$(find . -type f \
                    \( -name "detekt-baseline*.xml" -o -name "lint-baseline.xml" -o -name "baseline.xml" \) \
                    -not -path "./.git/*" || true)
          if [ -n "$found" ]; then
            echo "::error::Baseline files found — fix the findings instead of baselining them:"
            echo "$found"
            exit 1
          fi
          echo "OK — no baselines."

      # Task 2 done-when #2: no Groovy build files anywhere.
      - name: Assert no Groovy build files
        run: |
          # -type f matters: the Gradle cache DIRECTORY is literally named `.gradle`,
          # and the glob `*.gradle` matches it (the `*` matches an empty string).
          # Without -type f this assertion fails on every build that has run once.
          found=$(find . -type f -name "*.gradle" \
                    -not -path "./.git/*" \
                    -not -path "*/.gradle/*" \
                    -not -path "*/build/*" || true)
          if [ -n "$found" ]; then
            echo "::error::Groovy build files found (Kotlin DSL only):"
            echo "$found"
            exit 1
          fi
          echo "OK — Kotlin DSL only."

      # Task 2 done-when #3: every version lives in the catalog.
      - name: Assert no inline dependency versions
        run: |
          bad=$(grep -rnE '(implementation|api|classpath|compileOnly|runtimeOnly|ksp|kapt)\s*\(?["'"'"'][^"'"'"']+:[^"'"'"']+:[0-9]' \
                  --include="*.gradle.kts" . || true)
          if [ -n "$bad" ]; then
            echo "::error::Inline dependency versions found — they belong in gradle/libs.versions.toml:"
            echo "$bad"
            exit 1
          fi
          echo "OK — all versions come from the version catalog."

      # Task 4 done-when #2 — cheap structural check, run before the expensive one.
      - name: Assert :domain applies no Android plugin
        run: |
          if grep -qE 'whatsappv2\.android|com\.android\.|^\s*android\s*\{' domain/build.gradle.kts; then
            echo "::error:::domain must stay a pure JVM module (§4.1, DoD 2)."
            cat domain/build.gradle.kts
            exit 1
          fi
          echo "OK — :domain applies no Android plugin."

      # Task 4 done-when #3 — the boundary must be enforced by the BUILD, not by
      # convention. A JVM library cannot consume an AAR, so this must fail.
      # Task 4 done-when #3 — the boundary must be enforced by the BUILD, not by
      # convention. A JVM library cannot consume an AAR, so this must fail.
      #
      # Written with printf rather than a heredoc: a heredoc terminator must sit at
      # column 0, which terminates the surrounding YAML block scalar and makes the
      # whole workflow file invalid.
      - name: Assert :domain rejects an Android dependency
        run: |
          cp domain/build.gradle.kts "$RUNNER_TEMP/domain.bak"
          printf '\ndependencies {\n    implementation("androidx.core:core-ktx:1.19.0")\n}\n' \
            >> domain/build.gradle.kts
          if ./gradlew :domain:build -q >/dev/null 2>&1; then
            cp "$RUNNER_TEMP/domain.bak" domain/build.gradle.kts
            echo "::error:::domain accepted an Android dependency - the layer boundary is NOT enforced."
            exit 1
          fi
          cp "$RUNNER_TEMP/domain.bak" domain/build.gradle.kts
          echo "OK - :domain rejects Android dependencies at build time."

      # Task 5 done-when #2 — the ban on android.util.Log must be ENFORCED, not just
      # configured. Plant a violation in a module that is not exempt and require detekt
      # to fail. Uses a here-string via printf: a heredoc terminator at column 0 would
      # break the surrounding YAML block scalar.
      - name: Assert android.util.Log is rejected outside the logging facade
        run: |
          PROBE=data/sip/src/main/kotlin/com/whatsappv2/data/sip/LogProbe.kt
          mkdir -p "$(dirname "$PROBE")"
          printf 'package com.whatsappv2.data.sip\n\nimport android.util.Log\n\nobject LogProbe {\n    fun leak() {\n        Log.d("probe", "should be rejected")\n    }\n}\n' > "$PROBE"
          if ./gradlew :data:sip:detekt -q >/dev/null 2>&1; then
            rm -f "$PROBE"
            echo "::error::detekt accepted android.util.Log outside the facade - the ban is NOT enforced (Task 5, DoD 12)."
            exit 1
          fi
          rm -f "$PROBE"
          echo "OK - android.util.Log is rejected outside the logging facade."

      # Task 5 done-when #3 depends on BOTH variant loggers existing. A stray
      # "release/" entry in .gitignore once silenced the release one entirely, so the
      # release build had no logger and the guarantee was quietly absent.
      - name: Assert both variant loggers are tracked
        run: |
          missing=0
          for v in debug release; do
            f="app/src/$v/java/com/whatsappv2/logging/PlatformLogger.kt"
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is not tracked by git - is it caught by .gitignore?"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "OK - both variant loggers are tracked."
          exit $missing

      - name: Coverage
        run: ./gradlew koverXmlReport koverHtmlReport --stacktrace

      # Task 5 done-when #1: the Outcome type must be >= 95% line-covered.
      # Task 68 will extend this to >= 80% across :domain and :data:*.
      - name: Assert coverage thresholds
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          # package path -> minimum line coverage percent
          THRESHOLDS = {
              "com/whatsappv2/core/common/result": 95,
              "com/whatsappv2/domain/model": 95,
              "com/whatsappv2/domain/validation": 95,
              "com/whatsappv2/domain/call": 95,
              "com/whatsappv2/domain/engine": 95,
              "com/whatsappv2/core/common/secret": 100,
              "com/whatsappv2/core/common/time": 95,
              # Test support, held to a floor rather than the production bar: its
              # uncovered lines are error paths no test needs to exercise.
              "com/whatsappv2/domain/testing": 90,
              "com/whatsappv2/data/account/crypto": 85,
          }

          reports = glob.glob("**/build/reports/kover/report.xml", recursive=True)
          if not reports:
              print("::error::No Kover XML report found - the coverage step produced nothing.")
              sys.exit(1)
          print("reports:", reports)

          totals = {}
          for path in reports:
              for pkg in ET.parse(path).getroot().iter("package"):
                  name = pkg.get("name", "")
                  for c in pkg.findall("counter"):
                      if c.get("type") == "LINE":
                          missed, covered = int(c.get("missed", 0)), int(c.get("covered", 0))
                          m, cv = totals.get(name, (0, 0))
                          totals[name] = (m + missed, cv + covered)

          failed = False
          rows = []
          for name, (missed, covered) in sorted(totals.items()):
              total = missed + covered
              pct = 100.0 * covered / total if total else 100.0
              required = THRESHOLDS.get(name)
              flag = ""
              if required is not None:
                  flag = f"  (required >= {required}%)"
                  if pct < required:
                      print(f"::error::{name} line coverage {pct:.1f}% < {required}%")
                      failed = True
              print(f"{pct:6.1f}%  {covered:5d}/{total:-5d}  {name}{flag}")
              rows.append((name, pct, covered, total, required))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### Coverage\n\n")
                  fh.write("| Package | Line coverage | Covered / total | Gate |\n")
                  fh.write("|---|---:|---:|---:|\n")
                  for name, pct, covered, total, required in rows:
                      gate = f"{required}%" if required is not None else "-"
                      mark = "" if required is None or pct >= required else " :x:"
                      fh.write(f"| `{name}` | {pct:.1f}%{mark} | {covered}/{total} | {gate} |\n")
                  fh.write("\nFull HTML reports are in the **coverage** artifact.\n\n")

          for name in THRESHOLDS:
              if name not in totals:
                  print(f"::error::No coverage data for {name} - is the package name right?")
                  failed = True

          if failed:
              print("\n--- uncovered lines in threshold packages ---")
              for path in reports:
                  for pkg in ET.parse(path).getroot().iter("package"):
                      if pkg.get("name", "") not in THRESHOLDS:
                          continue
                      for sf in pkg.findall("sourcefile"):
                          missed = [ln.get("nr") for ln in sf.findall("line")
                                    if int(ln.get("mi", 0)) > 0]
                          if missed:
                              print(f"  {sf.get('name')}: lines {', '.join(missed)}")
          sys.exit(1 if failed else 0)
          PY

      # Coverage is a deliverable, not just a gate: Task 68 has to report real measured
      # numbers, and a report that only exists inside a log line cannot be reviewed.
      - name: Publish coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ github.sha }}
          path: |
            **/build/reports/kover/**
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------- APK
      # Every push produces a downloadable, installable debug APK. Debug, not release:
      # a release build needs a signing keystore, and keystores are not something CI
      # should hold or this repo should carry.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Report APK size
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "APK: $APK"
          echo "Size: $(du -h "$APK" | cut -f1)"
          {
            echo "### Debug APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$APK")\` |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this run."
            echo ""
            echo "> Installs and launches, but shows a blank screen: the design system"
            echo "> and navigation arrive in Tasks 14-15."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: whatsapp-v2-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 7

  # ------------------------------------------------------------------ security
  # §7: "run a vulnerability check in CI". Resolves the REAL dependency tree - not
  # just the direct entries in the version catalog - and queries OSV.dev, which
  # aggregates GitHub Advisories and the CVE feeds.
  #
  # Written against the OSV HTTP API rather than a scanner action: the query and the
  # failure condition are both visible here, so a green result means something
  # specific rather than "some action exited zero".
  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure the Android platform this build compiles against is present
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          COMPILE_SDK=$(grep -E '^compileSdk' gradle/libs.versions.toml | grep -oE '[0-9]+')
          if compgen -G "$SDK/platforms/android-$COMPILE_SDK" > /dev/null ||
             compgen -G "$SDK/platforms/android-$COMPILE_SDK.*" > /dev/null; then
            echo "OK - a platform for API $COMPILE_SDK is already installed."
            exit 0
          fi
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$COMPILE_SDK"

      - name: Resolve the runtime dependency tree
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > deps.txt

      - name: Query OSV.dev
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          # Gradle prints "group:name:version", sometimes with a conflict resolution
          # "-> version". The resolved version is what actually ships, so it wins.
          COORD = re.compile(
              r"([A-Za-z0-9_.\-]+):([A-Za-z0-9_.\-]+):"
              r"([A-Za-z0-9_.\-+]+)(?:\s*->\s*([A-Za-z0-9_.\-+]+))?"
          )

          packages = {}
          for line in open("deps.txt"):
              if "project :" in line:
                  continue
              m = COORD.search(line)
              if m:
                  group, name, declared, resolved = m.groups()
                  packages[(f"{group}:{name}", resolved or declared)] = True

          coords = sorted(packages)
          print(f"Resolved {len(coords)} unique dependencies")
          if not coords:
              print("::error::No dependencies parsed - the scan would pass vacuously.")
              sys.exit(1)

          allow = set()
          path = ".github/osv-allowlist.txt"
          if os.path.exists(path):
              for line in open(path):
                  entry = line.split("#")[0].strip()
                  if entry:
                      allow.add(entry)

          findings = []
          CHUNK = 500
          for i in range(0, len(coords), CHUNK):
              batch = coords[i:i + CHUNK]
              body = json.dumps({
                  "queries": [
                      {"package": {"name": n, "ecosystem": "Maven"}, "version": v}
                      for n, v in batch
                  ]
              }).encode()
              req = urllib.request.Request(
                  "https://api.osv.dev/v1/querybatch",
                  data=body,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  results = json.load(resp).get("results", [])
              for (name, version), result in zip(batch, results):
                  for vuln in result.get("vulns", []) or []:
                      if vuln["id"] not in allow:
                          findings.append((name, version, vuln["id"]))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if findings:
              print(f"::error::{len(findings)} known vulnerability(ies) in dependencies")
              for name, version, vid in findings:
                  print(f"  {name}:{version}  {vid}  https://osv.dev/vulnerability/{vid}")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("### Vulnerable dependencies\n\n")
                      fh.write("| Dependency | Version | Advisory |\n|---|---|---|\n")
                      for name, version, vid in findings:
                          fh.write(f"| `{name}` | {version} | [{vid}](https://osv.dev/vulnerability/{vid}) |\n")
              sys.exit(1)

          print(f"OK - no known vulnerabilities across {len(coords)} dependencies.")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(f"### Dependency vulnerabilities\n\nNone across {len(coords)} resolved dependencies.\n\n")
          PY
