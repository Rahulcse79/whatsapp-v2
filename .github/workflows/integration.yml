# Integration tests against a real FreeSWITCH (Tasks 32, 33).
#
# Deliberately NOT part of the push gate. ADR-005 accepted a shared, non-hermetic server,
# and the consequence is that a run can fail because of someone else's handset. Making
# every push depend on that would teach people to ignore a red build, which costs more
# than the coverage is worth. `ci.yml` stays green with no SIP server reachable at all.
#
# ## This needs a runner that can reach the server
#
# GitHub's hosted runners cannot reach a SIP server on a private network, which is where
# the current test target lives. So this workflow is written for a **self-hosted** runner
# on that network, and is dispatch-only by default. The weekly schedule is there for when
# a reachable target exists; until then a scheduled run will skip, not fail, because the
# secrets it needs are absent.
name: Integration tests

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to use (self-hosted runner on the server's network)"
        required: false
        default: "ubuntu-latest"
  schedule:
    # Sunday 03:00 UTC. Weekly, not nightly: the suite talks to shared infrastructure and
    # there is no point contending for it every night to learn the same thing.
    - cron: "0 3 * * 0"

# ADR-005's mitigation, and the reason it is a group of one: two runs would use the same
# reserved extensions at the same time and interfere in ways that look like flakes.
# `cancel-in-progress: false` because cancelling mid-call can leave a registration behind
# on the server.
concurrency:
  group: sip-integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Registration against the test target
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Absent configuration is a skip, not a failure. A red build that only means "nobody
      # gave this a server" trains people to ignore red builds.
      - name: Check whether a target is configured
        id: target
        env:
          SIP_TEST_HOST: ${{ secrets.SIP_TEST_HOST }}
        run: |
          if [ -z "$SIP_TEST_HOST" ]; then
            echo "::notice::No SIP_TEST_HOST secret; skipping. See docs/testing.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # A real device is not available on a hosted runner, so the suite runs on an
      # emulator. KVM has to be reachable for that to be anything but unusably slow.
      - name: Enable KVM
        if: steps.target.outputs.configured == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented registration suite
        if: steps.target.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Passed as environment variables, which is the form the build reads secrets in.
          # Never echoed: a `set -x` here would put a SIP password in a public log.
          SIP_TEST_HOST: ${{ secrets.SIP_TEST_HOST }}
          SIP_TEST_DOMAIN: ${{ secrets.SIP_TEST_DOMAIN }}
          SIP_TEST_PORT: ${{ secrets.SIP_TEST_PORT }}
          SIP_TEST_EXTENSION: ${{ secrets.SIP_TEST_EXTENSION }}
          SIP_TEST_EXTENSION_SECONDARY: ${{ secrets.SIP_TEST_EXTENSION_SECONDARY }}
          SIP_TEST_PASSWORD: ${{ secrets.SIP_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          # The SIP stack ships no 32-bit x86 libraries, and google_apis carries the
          # networking bits a bare AOSP image does not.
          target: google_apis
          script: ./gradlew :data:sip:connectedAndroidTest --stacktrace

      - name: Upload the integration report
        if: always() && steps.target.outputs.configured == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: integration-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
