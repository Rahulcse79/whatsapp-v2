# Builds pjproject (PJSIP) for Android and publishes the result as a workflow artifact.
#
# Why this exists: PJSIP publishes no Android AAR. Unlike liblinphone, which ships one
# with prebuilt `.so` files, pjsua2 for Android is a source build — `./configure-android`,
# `make`, then SWIG-generated Java bindings. ADR-006 records that, and this workflow is
# the "build it ourselves" option from it.
#
# It is `workflow_dispatch` only, exactly like the Gradle wrapper bootstrap: it produces
# binaries the repository cannot author by hand, it takes far too long to sit on the CI
# gate, and nothing in the app consumes its output until ADR-006 is accepted.
#
# STATUS: UNVERIFIED. This has still never completed a run, and nothing below changes
# that — it is written from the official build instructions (docs.pjsip.org). Treat the
# first few runs as the real design work.
#
# What has changed is that the failure modes are now loud. Three things this build could
# previously do quietly, and no longer can:
#
#   1. Build Opus with the HOST `ar`, because the NDK stopped shipping triple-prefixed
#      binutils and autotools fell back. AR/RANLIB/NM/STRIP are named explicitly.
#   2. Configure with no TLS and no Opus and carry on regardless. `configure-android`
#      does not fail on a missing --with-ssl; the build now does. A PJSIP without those
#      fails DoD 13 and §5.2, which is most of the point of the app.
#   3. "Check" 16 KB alignment by printing the LOAD headers. It asserts now.
#
# It also gathers its output into a layout an AAR can be assembled from, rather than
# uploading the SWIG sample-app tree and leaving that to whoever consumes it.
name: Build PJSIP for Android

on:
  workflow_dispatch:
    inputs:
      pjsip-version:
        description: "pjproject tag to build (latest stable was 2.17, 22 Apr 2026)"
        required: true
        default: "2.17"
      openssl-version:
        description: "OpenSSL version to cross-compile for TLS (DoD 13)"
        required: true
        default: "3.5.0"
      opus-version:
        description: "Opus version to cross-compile (§5.2 audio quality)"
        required: true
        default: "1.5.2"
      libvpx-version:
        description: "libvpx tag to cross-compile for VP8 (the only video codec the server offers)"
        required: true
        default: "v1.17.0"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The Java API, without building anything native.
  #
  # SWIG generates the bindings from the pjsua2 headers alone - no NDK, no
  # OpenSSL, no Opus, no cross-compile. That takes about a minute against the
  # hour the matrix below needs, and it answers the question that actually blocks
  # writing the adapter: what do the generated Java classes look like?
  #
  # It is a separate job with no `needs:` precisely so it lands first and can be
  # read while the native build is still running. `docs/pjsip-migration.md` §3 is
  # written from the C++ headers; this is what it gets checked against, because
  # SWIG's mapping is faithful but not literal - enums become classes of static
  # ints, std::vector becomes a typed vector class, and overloads collapse.
  # ---------------------------------------------------------------------------
  bindings:
    name: "Generate the pjsua2 Java API"
    runs-on: ubuntu-latest

    steps:
      - name: Install SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
          # Printed, and not merely installed. `pjsip/api` is this job's output checked
          # into the repository, and the .so exports JNI symbols named after the Java
          # SWIG generated beside it - so a runner-image bump that changes this version
          # silently invalidates both. See pjsip/api/build.gradle.kts.
          swig -version

      - name: Fetch pjproject ${{ inputs.pjsip-version }}
        run: |
          curl -fsSL -o pjproject.tar.gz \
            "https://github.com/pjsip/pjproject/archive/refs/tags/${{ inputs.pjsip-version }}.tar.gz"
          mkdir -p pjproject && tar -xzf pjproject.tar.gz -C pjproject --strip-components=1

      - name: Generate
        run: |
          set -euo pipefail
          cd pjproject

          # SWIG parses this. It is normally written by configure, and the feature
          # flags must match the ones the native build below uses or the generated
          # API describes a library nobody is shipping.
          cat > pjlib/include/pj/config_site.h <<'SITE'
          #define PJMEDIA_HAS_VIDEO 1
          #define PJMEDIA_HAS_OPENH264_CODEC 0
          #define PJMEDIA_HAS_VPX_CODEC 1
          #define PJMEDIA_HAS_OPUS_CODEC 1
          #define PJSIP_HAS_TLS_TRANSPORT 1
          SITE
          sed -i 's/^          //' pjlib/include/pj/config_site.h

          mkdir -p "$GITHUB_WORKSPACE/bindings/org/pjsip/pjsua2" "$GITHUB_WORKSPACE/gen"
          cd pjsip-apps/src/swig/java

          swig -I../../../../pjlib/include -I../../../../pjlib-util/include \
               -I../../../../pjmedia/include -I../../../../pjsip/include \
               -I../../../../pjnath/include \
               -c++ -D__ANDROID__ -java -package org.pjsip.pjsua2 \
               -outdir "$GITHUB_WORKSPACE/bindings/org/pjsip/pjsua2" \
               -o "$GITHUB_WORKSPACE/gen/pjsua2_wrap.cpp" ../pjsua2.i

          cd "$GITHUB_WORKSPACE"
          count="$(find bindings -name '*.java' | wc -l)"
          echo "generated $count Java files"
          [ "$count" -gt 0 ] || { echo "::error::SWIG produced nothing"; exit 1; }

          # SWIG covers `org.pjsip.pjsua2` and nothing else. The `org.pjsip` classes
          # are hand-written Java that pjproject ships next to the C it calls through
          # JNI - the camera and audio device shims. The AAR carries them, so an API
          # that leaves them out is not the AAR's API: `org.pjsip.PjCameraInfo2`,
          # which the adapter calls before it can enumerate a capture device, would
          # not resolve. Copied, not regenerated - there is nothing to generate.
          for j in pjproject/pjmedia/src/pjmedia-videodev/android/*.java \
                   pjproject/pjmedia/src/pjmedia-audiodev/android/*.java; do
            [ -f "$j" ] || { echo "::error::missing $j"; exit 1; }
            cp "$j" bindings/org/pjsip/
          done
          helpers="$(find bindings/org/pjsip -maxdepth 1 -name '*.java' | wc -l)"
          echo "copied $helpers hand-written org.pjsip helpers"
          [ "$helpers" -ge 5 ] || { echo "::error::expected 5 helpers, got $helpers"; exit 1; }

          # The signatures the migration plan has to agree with, printed into the
          # log so a reviewer can diff §3 without downloading anything.
          echo "::group::Public API of the classes the adapter uses"
          for c in Endpoint Account Call AccountConfig CallOpParam CallSetting \
                   CallInfo CallMediaInfo VideoWindow VideoWindowHandle \
                   AudDevManager VidDevManager AuthCredInfo TransportConfig; do
            f="bindings/org/pjsip/pjsua2/$c.java"
            [ -f "$f" ] || { echo "  -- $c: NOT GENERATED"; continue; }
            echo "  ---- $c ----"
            grep -oE '^\s+public [^{;]+' "$f" | sed 's/^\s*/    /'
          done
          echo "::endgroup::"

      - name: Publish the generated API
        uses: actions/upload-artifact@v4
        with:
          name: pjsua2-java-api-${{ inputs.pjsip-version }}
          if-no-files-found: error
          path: bindings/**

  build:
    name: "pjproject ${{ inputs.pjsip-version }} · ${{ matrix.abi }}"
    runs-on: ubuntu-latest

    strategy:
      # One ABI per job so a failure names the architecture that failed, and so the
      # three run in parallel rather than serially for an hour each.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            host: aarch64-linux-android
            openssl-target: android-arm64
            vpx-target: arm64-android-gcc
          - abi: armeabi-v7a
            host: armv7a-linux-androideabi
            openssl-target: android-arm
            vpx-target: armv7-android-gcc
          - abi: x86_64
            host: x86_64-linux-android
            openssl-target: android-x86_64
            vpx-target: x86_64-android-gcc

    env:
      # Must match app/build.gradle.kts abiFilters. An ABI built here and not packaged
      # there is wasted build time; one packaged and not built is a crash on that device.
      ANDROID_API: "26"

    steps:
      - name: Report what is being built, so a pin comes from evidence
        run: |
          echo "::group::Inputs"
          echo "pjproject : ${{ inputs.pjsip-version }}"
          echo "OpenSSL   : ${{ inputs.openssl-version }}"
          echo "Opus      : ${{ inputs.opus-version }}"
          echo "ABI       : ${{ matrix.abi }} (host ${{ matrix.host }})"
          echo "minSdk    : $ANDROID_API"
          echo "::endgroup::"

      # r27 or later is not a preference. Android 15 requires 16 KB page alignment and
      # Play rejects updates without it; earlier NDKs cannot produce it.
      - name: Set up the NDK (r27+, for 16 KB page sizes)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          # NOT cached. With local-cache: true the action restored a tree that had
          # `toolchains/llvm/prebuilt` and nothing inside it - an NDK with no compiler,
          # which is worse than no NDK because every later step still looks like it
          # should work. A fresh download costs a couple of minutes on a job that takes
          # an hour.
          local-cache: false

      # nttld/setup-ndk promises no particular layout, and OpenSSL depends on one: its
      # android targets resolve the compiler with `which("clang")` and require the result
      # to sit INSIDE $ANDROID_NDK_ROOT (Configurations/15-android.conf). When the
      # hardcoded `toolchains/llvm/prebuilt/linux-x86_64/bin` did not exist, `clang`
      # resolved to /usr/bin/clang, that match failed, and Configure fell back to a gcc
      # the NDK has not shipped since r18 - "no NDK aarch64-linux-android-gcc on $PATH",
      # which is what all three ABIs died of on 2026-09-08.
      #
      # So locate the toolchain rather than assume it, export the root it actually
      # belongs to, and fail here, with the layout printed, rather than four steps later.
      - name: Locate the NDK toolchain
        run: |
          set -euo pipefail
          # Candidates in order of preference: what setup-ndk reports, then the NDKs the
          # runner image already carries. Any of them will do provided it has a compiler.
          clang=""
          for root in "${{ steps.ndk.outputs.ndk-path }}" \
                      "${ANDROID_NDK_LATEST_HOME:-}" \
                      "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/*; do
            [ -n "$root" ] && [ -d "$root" ] || continue
            # No -type f: `clang` is a symlink in some NDK layouts, and a symlink to a
            # working compiler is a working compiler.
            found="$(find "$root" -path '*/toolchains/llvm/prebuilt/*/bin/clang' 2>/dev/null | head -1)"
            if [ -n "$found" ]; then
              echo "using NDK at $root"
              clang="$found"
              break
            fi
            echo "skipping $root - no clang under toolchains/llvm/prebuilt"
          done
          if [ -z "$clang" ]; then
            echo "::error::no NDK with a usable clang on this runner"
            for root in "${{ steps.ndk.outputs.ndk-path }}" "${ANDROID_NDK_LATEST_HOME:-}"; do
              [ -d "$root" ] || continue
              echo "--- $root"
              ls -la "$root/toolchains/llvm/prebuilt" 2>&1 | head -10
            done
            exit 1
          fi
          bin="$(dirname "$clang")"
          # bin -> <host> -> prebuilt -> llvm -> toolchains -> the NDK root itself
          ndk="$(cd "$bin/../../../../.." && pwd)"
          echo "NDK root      : $ndk"
          echo "toolchain bin : $bin"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install the build tools pjsua2 needs
        run: |
          sudo apt-get update
          # swig generates the Java bindings; the rest is the ordinary autotools chain.
          sudo apt-get install -y swig build-essential autoconf libtool pkg-config

      - name: Fetch pjproject ${{ inputs.pjsip-version }}
        run: |
          curl -fsSL -o pjproject.tar.gz \
            "https://github.com/pjsip/pjproject/archive/refs/tags/${{ inputs.pjsip-version }}.tar.gz"
          mkdir -p pjproject && tar -xzf pjproject.tar.gz -C pjproject --strip-components=1

      # ITERATE HERE FIRST. A bare configure-android finds no OpenSSL and silently builds
      # a stack with TLS disabled - which does not fail the build, it fails DoD 13 at
      # run time on a TLS account. The `Checking for OpenSSL` line in the configure
      # output is the thing to read.
      - name: Cross-compile OpenSSL ${{ inputs.openssl-version }}
        run: |
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${{ inputs.openssl-version }}/openssl-${{ inputs.openssl-version }}.tar.gz"
          mkdir -p openssl && tar -xzf openssl.tar.gz -C openssl --strip-components=1
          cd openssl
          ./Configure ${{ matrix.openssl-target }} -D__ANDROID_API__=$ANDROID_API \
            --prefix="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" no-shared no-tests
          make -j"$(nproc)" && make install_sw

      # The second half of the same problem: without Opus, PJSIP negotiates narrowband
      # codecs and the call sounds like 2005.
      - name: Cross-compile Opus ${{ inputs.opus-version }}
        run: |
          curl -fsSL -o opus.tar.gz \
            "https://downloads.xiph.org/releases/opus/opus-${{ inputs.opus-version }}.tar.gz"
          mkdir -p opus && tar -xzf opus.tar.gz -C opus --strip-components=1
          cd opus
          # AR/RANLIB/NM/STRIP are passed explicitly because the NDK removed the
          # triple-prefixed binutils. Left to itself, autotools looks for
          # `aarch64-linux-android-ar`, does not find it, and falls back to the HOST `ar`
          # - which produces an x86_64 archive that then fails to link into an arm64 .so,
          # or worse, links and misbehaves. Every LLVM tool is multi-target, so the
          # unprefixed name is the correct one.
          ./configure --host=${{ matrix.host }} \
            CC="${{ matrix.host }}$ANDROID_API-clang" \
            AR=llvm-ar RANLIB=llvm-ranlib NM=llvm-nm STRIP=llvm-strip \
            --prefix="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" \
            --disable-shared --enable-static
          make -j"$(nproc)" && make install

      # VP8, and it is not optional for this deployment. The target FreeSWITCH has
      # mod_av missing and mod_h26x unloaded, so its only working video codec is the VP8
      # that CORE_VPX provides. PJSIP's other route to video is OpenH264, which this build
      # disables. Without libvpx there is no video codec both ends can negotiate, and
      # "video calling" is the requirement this whole app exists for.
      #
      # It is also what broke run #13: config_site.h force-enabled PJMEDIA_HAS_VPX_CODEC
      # while configure had correctly decided "Checking if VPX is disabled... yes". `make
      # dep` then ran the compiler over vpx.c, which failed on a missing
      # 'vpx/vpx_encoder.h', and the error text landed IN the generated .depend - which is
      # the "missing separator" at line 4351 that killed all three ABIs.
      # No `env:` NDK override here on purpose. "Locate the NDK toolchain" already put the
      # verified toolchain on PATH and ANDROID_NDK_ROOT into the environment; pointing this
      # step back at `steps.ndk.outputs.ndk-path` would reintroduce exactly the cached-NDK
      # -with-no-compiler failure that step exists to prevent.
      - name: Cross-compile libvpx ${{ inputs.libvpx-version }}
        run: |
          set -euo pipefail
          curl -fsSL -o libvpx.tar.gz \
            "https://github.com/webmproject/libvpx/archive/refs/tags/${{ inputs.libvpx-version }}.tar.gz"
          mkdir -p libvpx && tar -xzf libvpx.tar.gz -C libvpx --strip-components=1
          cd libvpx

          # The same trap the Opus step fell into, in libvpx's own words: its configure
          # defaults are `CC=${CROSS}gcc` and `AR=${CROSS}ar` (build/make/configure.sh),
          # and a modern NDK ships neither a triple-prefixed gcc nor a triple-prefixed ar.
          # Left alone it finds the HOST tools and builds an x86_64 archive that cannot
          # link into an arm64 .so. Naming them is what makes the target mean anything.
          #
          # CROSS is emptied rather than unset: the defaults interpolate it, so a stale
          # value would put a prefix back on the names below.
          export CROSS=""
          export CC="${{ matrix.host }}$ANDROID_API-clang"
          export CXX="${{ matrix.host }}$ANDROID_API-clang++"
          export LD="$CC"
          export AR=llvm-ar RANLIB=llvm-ranlib NM=llvm-nm STRIP=llvm-strip

          # AS is the same trap one tool further on, and ON ARM ONLY.
          #
          # `setup_gnu_toolchain` defaults it to `AS=${AS:-${CROSS}as}`, so emptying
          # CROSS above resolves it to a bare `as` - the runner's HOST x86_64 assembler
          # - which meets libvpx's own `-march=armv7-a` asflag and dies with "invalid
          # -march= option". `$CC -c` is libvpx's own remedy: configure.sh writes
          # exactly that for its Windows ARM targets, and the `-c` is load-bearing
          # because the rule is `$(AS) $(ASFLAGS) -o $@ $<` and supplies none of its
          # own. Clang's integrated assembler takes the ads2gas output and every asflag
          # libvpx derives for armv7.
          #
          # x86 must NOT get it. There the assembler is yasm and ASFLAGS are yasm's, so
          # clang is handed `-f elf64` and answers "unknown argument: '-f'". Setting AS
          # unconditionally traded a broken armeabi-v7a for a broken x86_64, which is
          # how this reads as a `case` rather than an export.
          #
          # Keyed off vpx-target because that is the axis that decides it: `arm*`
          # matches both ARM legs and nothing else. 32-bit ARM is the only target with
          # an ads2gas `.asm.S` path at all, so arm64 neither needs this nor is harmed
          # by it - it has no `.asm.S` to assemble.
          case "${{ matrix.vpx-target }}" in
            arm*) export AS="$CC -c" ;;
          esac

          # libvpx names its own targets, and they are not the autotools host triples the
          # other two cross-compiles use, so the matrix carries both.
          ./configure --target=${{ matrix.vpx-target }} \
            --prefix="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" \
            --disable-examples --disable-tools --disable-docs --disable-unit-tests \
            --enable-pic --enable-static --disable-shared \
            --enable-vp8 --enable-vp9
          make -j"$(nproc)" && make install

          test -f "$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}/include/vpx/vpx_encoder.h" \
            || { echo "::error::libvpx installed no headers - vpx.c will fail the same way again"; exit 1; }

      - name: Configure and build pjproject
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          cd pjproject
          # config_site.h is where PJSIP's compile-time feature set is decided. Video is
          # off by default and this app needs it (§5.2, Tasks 51-54).
          cat > pjlib/include/pj/config_site.h <<'SITE'
          #define PJMEDIA_HAS_VIDEO 1
          #define PJMEDIA_HAS_OPENH264_CODEC 0
          #define PJMEDIA_HAS_VPX_CODEC 1
          #define PJMEDIA_HAS_OPUS_CODEC 1
          #define PJSIP_HAS_TLS_TRANSPORT 1
          #include <pj/config_site_sample.h>
          SITE
          # 16 KB pages: r27 links its own output aligned, but pjproject drives its link
          # line itself, so the flag is stated rather than assumed. An unaligned .so is one
          # Android 15 refuses to load on a 16 KB device.
          export LDFLAGS="${LDFLAGS} -Wl,-z,max-page-size=16384"

          ./configure-android --use-ndk-cflags \
            --with-ssl="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" \
            --with-opus="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" \
            --with-vpx="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}"

          echo "::group::configure summary - the SSL and Opus lines"
          grep -iE "ssl|opus|video" config.log | tail -40 || true
          echo "::endgroup::"

          # The whole point of the two cross-compiles above, asserted rather than eyeballed.
          # `configure-android` does NOT fail when it cannot find OpenSSL or Opus - it
          # quietly builds a stack without TLS and without wideband audio, and the first
          # anybody knows is a TLS account failing on a handset (DoD 13) or a call that
          # sounds like 2005 (§5.2). A build that silently drops them is worse than no
          # build, so this stops here instead.
          if ! grep -qE '^#define PJ_HAS_SSL_SOCK[[:space:]]+1' pjlib/include/pj/compat/os_auto.h 2>/dev/null \
             && ! grep -qiE 'ssl.*(enabled|found)' config.log; then
            echo "::error::TLS is NOT enabled - configure did not find OpenSSL. See --with-ssl."
            exit 1
          fi
          if ! grep -qiE 'opus.*(enabled|found)|found opus' config.log; then
            echo "::error::Opus is NOT enabled - configure did not find it. See --with-opus."
            exit 1
          fi
          # The one that actually failed. `configure` prints "Checking if VPX is
          # disabled... yes" when it cannot find libvpx, and config_site.h then enables the
          # codec anyway - which is not a link error later, it is a corrupt .depend now.
          if grep -qi 'Checking if VPX is disabled\.\.\. yes' config.log; then
            echo "::error::VPX is NOT enabled - configure did not find libvpx. See --with-vpx."
            echo "::error::config_site.h sets PJMEDIA_HAS_VPX_CODEC 1, so make dep will corrupt .depend."
            exit 1
          fi

          make dep && make clean && make -j"$(nproc)"

      - name: Build the pjsua2 Java bindings
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          cd pjproject/pjsip-apps/src/swig
          make

      - name: Confirm the result is 16 KB aligned
        run: |
          # The check that matters for Play. A .so that is not 16 KB aligned is one
          # Android 15 will refuse to load on a 16 KB device.
          READELF="$(command -v llvm-readelf)"
          [ -n "$READELF" ] || { echo "::error::llvm-readelf is not on \$PATH"; exit 1; }

          # This used to print the LOAD headers and stop, which is a check that cannot
          # fail. It now asserts every loadable segment is aligned to at least 16 KB
          # (0x4000) and exits non-zero otherwise - the alignment is the reason the step
          # exists, and Play rejects the upload rather than warning about it.
          found=0
          status=0
          while IFS= read -r -d '' so; do
            found=1
            echo "--- $so"
            "$READELF" -lW "$so" | awk '$1 == "LOAD"'
            if "$READELF" -lW "$so" | awk '$1 == "LOAD" { print $NF }' \
                 | grep -qvE '^0x(4000|8000|10000)$'; then
              echo "::error::$so has a LOAD segment aligned under 16 KB"
              status=1
            fi
          done < <(find pjproject -name 'libpjsua2.so' -print0)

          if [ "$found" -eq 0 ]; then
            echo "::error::No libpjsua2.so was produced - the SWIG step did not build it"
            exit 1
          fi
          exit "$status"

      # Nothing downstream can consume `pjsip-apps/src/swig/java/android/**` as it lies -
      # it is a sample app tree. An AAR needs the .so under `jni/<abi>/` and the generated
      # bindings as a flat Java source root, so they are gathered into that shape here
      # while the paths are still known, rather than re-derived by whoever assembles it.
      - name: Gather the pieces into a consumable layout
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mkdir -p "staging/jni/$ABI" staging/java

          find pjproject -name 'libpjsua2.so' -exec cp -v {} "staging/jni/$ABI/" \;

          # The SWIG-generated bindings. Same for every ABI, and harmless to carry three
          # times: whoever assembles the AAR takes one copy, and the three must agree anyway.
          #
          # `-print -quit` rather than `| head -1`: under `set -o pipefail`, head closing
          # the pipe early hands find a SIGPIPE, and the step fails on a search that
          # succeeded. Stopping find itself has no pipe to break.
          srcroot="$(find pjproject/pjsip-apps/src/swig -type d -path '*/org/pjsip' -print -quit)"
          if [ -z "$srcroot" ]; then
            echo "::error::SWIG produced no org/pjsip bindings"
            exit 1
          fi
          # Copy the `org` root, so the tree keeps the package layout javac expects.
          cp -r "$(dirname "$srcroot")" staging/java/

          echo "::group::staged"
          find staging -type f | sed 's/^/  /'
          echo "::endgroup::"

      - name: Publish the build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: pjsip-${{ inputs.pjsip-version }}-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            staging/**
            pjproject/**/lib/*.a

  # ---------------------------------------------------------------------------
  # The three per-ABI builds above produce parts. Nothing in Gradle can consume
  # parts, so this is the step that turns them into one artifact a module can
  # depend on. It runs once, after all three ABIs, and fails if any is missing —
  # an AAR with two of three ABIs is a crash on the device that has the third.
  # ---------------------------------------------------------------------------
  aar:
    name: "Assemble pjsua2.aar"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Collect every ABI's build
        uses: actions/download-artifact@v4
        with:
          pattern: pjsip-${{ inputs.pjsip-version }}-*
          path: parts

      - name: Set up a JDK to compile the bindings with
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Assemble
        env:
          PJ_VERSION: ${{ inputs.pjsip-version }}
        run: |
          set -euo pipefail

          # Every ABI packaged by :app must be present. A missing one is not a
          # smaller AAR, it is an UnsatisfiedLinkError on that architecture.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="$(find parts -path "*/jni/$abi/libpjsua2.so" -print -quit)"
            if [ -z "$so" ]; then
              echo "::error::No libpjsua2.so for $abi - that ABI's build did not produce one"
              exit 1
            fi
            mkdir -p "aar/jni/$abi"
            cp "$so" "aar/jni/$abi/"
            echo "  $abi <- $so"
          done

          # The SWIG bindings are identical across ABIs; take the first and say so.
          srcroot="$(find parts -type d -name org -path '*/java/*' -print -quit)"
          if [ -z "$srcroot" ]; then
            echo "::error::No generated org/ source root in any artifact"
            exit 1
          fi

          # android.jar is on the classpath because the generated bindings reference
          # Android types directly - PjCameraInfo2 takes a CameraManager, and the
          # video handle takes a Surface. Without it javac fails on the first import.
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          echo "compiling against $ANDROID_JAR"

          mkdir -p classes
          find "$srcroot" -name '*.java' > sources.txt
          echo "  $(wc -l < sources.txt) generated source files"
          javac -nowarn -source 8 -target 8 -bootclasspath "$ANDROID_JAR" \
                -d classes @sources.txt

          (cd classes && jar cf ../aar/classes.jar .)

          # A prebuilt AAR still declares its package here; AGP reads it from the
          # manifest rather than from a namespace it has no build file for.
          cat > aar/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="org.pjsip.pjsua2" />
          MANIFEST
          sed -i 's/^          //' aar/AndroidManifest.xml

          (cd aar && zip -qr "../pjsua2-${PJ_VERSION}.aar" .)

          echo "::group::AAR contents"
          unzip -l "pjsua2-${PJ_VERSION}.aar"
          echo "::endgroup::"

      - name: Publish the AAR
        uses: actions/upload-artifact@v4
        with:
          name: pjsua2-aar-${{ inputs.pjsip-version }}
          if-no-files-found: error
          path: pjsua2-*.aar
