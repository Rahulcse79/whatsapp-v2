# Builds pjproject (PJSIP) for Android and publishes the result as a workflow artifact.
#
# Why this exists: PJSIP publishes no Android AAR. Unlike liblinphone, which ships one
# with prebuilt `.so` files, pjsua2 for Android is a source build — `./configure-android`,
# `make`, then SWIG-generated Java bindings. ADR-006 records that, and this workflow is
# the "build it ourselves" option from it.
#
# It is `workflow_dispatch` only, exactly like the Gradle wrapper bootstrap: it produces
# binaries the repository cannot author by hand, it takes far too long to sit on the CI
# gate, and nothing in the app consumes its output until ADR-006 is accepted.
#
# STATUS: UNVERIFIED. This has still never completed a run, and nothing below changes
# that — it is written from the official build instructions (docs.pjsip.org). Treat the
# first few runs as the real design work.
#
# What has changed is that the failure modes are now loud. Three things this build could
# previously do quietly, and no longer can:
#
#   1. Build Opus with the HOST `ar`, because the NDK stopped shipping triple-prefixed
#      binutils and autotools fell back. AR/RANLIB/NM/STRIP are named explicitly.
#   2. Configure with no TLS and no Opus and carry on regardless. `configure-android`
#      does not fail on a missing --with-ssl; the build now does. A PJSIP without those
#      fails DoD 13 and §5.2, which is most of the point of the app.
#   3. "Check" 16 KB alignment by printing the LOAD headers. It asserts now.
#
# It also gathers its output into a layout an AAR can be assembled from, rather than
# uploading the SWIG sample-app tree and leaving that to whoever consumes it.
name: Build PJSIP for Android

on:
  workflow_dispatch:
    inputs:
      pjsip-version:
        description: "pjproject tag to build (latest stable was 2.17, 22 Apr 2026)"
        required: true
        default: "2.17"
      openssl-version:
        description: "OpenSSL version to cross-compile for TLS (DoD 13)"
        required: true
        default: "3.5.0"
      opus-version:
        description: "Opus version to cross-compile (§5.2 audio quality)"
        required: true
        default: "1.5.2"

permissions:
  contents: read

jobs:
  build:
    name: "pjproject ${{ inputs.pjsip-version }} · ${{ matrix.abi }}"
    runs-on: ubuntu-latest

    strategy:
      # One ABI per job so a failure names the architecture that failed, and so the
      # three run in parallel rather than serially for an hour each.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            host: aarch64-linux-android
            openssl-target: android-arm64
          - abi: armeabi-v7a
            host: armv7a-linux-androideabi
            openssl-target: android-arm
          - abi: x86_64
            host: x86_64-linux-android
            openssl-target: android-x86_64

    env:
      # Must match app/build.gradle.kts abiFilters. An ABI built here and not packaged
      # there is wasted build time; one packaged and not built is a crash on that device.
      ANDROID_API: "26"

    steps:
      - name: Report what is being built, so a pin comes from evidence
        run: |
          echo "::group::Inputs"
          echo "pjproject : ${{ inputs.pjsip-version }}"
          echo "OpenSSL   : ${{ inputs.openssl-version }}"
          echo "Opus      : ${{ inputs.opus-version }}"
          echo "ABI       : ${{ matrix.abi }} (host ${{ matrix.host }})"
          echo "minSdk    : $ANDROID_API"
          echo "::endgroup::"

      # r27 or later is not a preference. Android 15 requires 16 KB page alignment and
      # Play rejects updates without it; earlier NDKs cannot produce it.
      - name: Set up the NDK (r27+, for 16 KB page sizes)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true

      - name: Install the build tools pjsua2 needs
        run: |
          sudo apt-get update
          # swig generates the Java bindings; the rest is the ordinary autotools chain.
          sudo apt-get install -y swig build-essential autoconf libtool pkg-config

      - name: Fetch pjproject ${{ inputs.pjsip-version }}
        run: |
          curl -fsSL -o pjproject.tar.gz \
            "https://github.com/pjsip/pjproject/archive/refs/tags/${{ inputs.pjsip-version }}.tar.gz"
          mkdir -p pjproject && tar -xzf pjproject.tar.gz -C pjproject --strip-components=1

      # ITERATE HERE FIRST. A bare configure-android finds no OpenSSL and silently builds
      # a stack with TLS disabled - which does not fail the build, it fails DoD 13 at
      # run time on a TLS account. The `Checking for OpenSSL` line in the configure
      # output is the thing to read.
      - name: Cross-compile OpenSSL ${{ inputs.openssl-version }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${{ inputs.openssl-version }}/openssl-${{ inputs.openssl-version }}.tar.gz"
          mkdir -p openssl && tar -xzf openssl.tar.gz -C openssl --strip-components=1
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd openssl
          ./Configure ${{ matrix.openssl-target }} -D__ANDROID_API__=$ANDROID_API \
            --prefix="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" no-shared no-tests
          make -j"$(nproc)" && make install_sw

      # The second half of the same problem: without Opus, PJSIP negotiates narrowband
      # codecs and the call sounds like 2005.
      - name: Cross-compile Opus ${{ inputs.opus-version }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          curl -fsSL -o opus.tar.gz \
            "https://downloads.xiph.org/releases/opus/opus-${{ inputs.opus-version }}.tar.gz"
          mkdir -p opus && tar -xzf opus.tar.gz -C opus --strip-components=1
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd opus
          # AR/RANLIB/NM/STRIP are passed explicitly because the NDK removed the
          # triple-prefixed binutils. Left to itself, autotools looks for
          # `aarch64-linux-android-ar`, does not find it, and falls back to the HOST `ar`
          # - which produces an x86_64 archive that then fails to link into an arm64 .so,
          # or worse, links and misbehaves. Every LLVM tool is multi-target, so the
          # unprefixed name is the correct one.
          ./configure --host=${{ matrix.host }} \
            CC="${{ matrix.host }}$ANDROID_API-clang" \
            AR=llvm-ar RANLIB=llvm-ranlib NM=llvm-nm STRIP=llvm-strip \
            --prefix="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" \
            --disable-shared --enable-static
          make -j"$(nproc)" && make install

      - name: Configure and build pjproject
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          cd pjproject
          # config_site.h is where PJSIP's compile-time feature set is decided. Video is
          # off by default and this app needs it (§5.2, Tasks 51-54).
          cat > pjlib/include/pj/config_site.h <<'SITE'
          #define PJMEDIA_HAS_VIDEO 1
          #define PJMEDIA_HAS_OPENH264_CODEC 0
          #define PJMEDIA_HAS_VPX_CODEC 1
          #define PJMEDIA_HAS_OPUS_CODEC 1
          #define PJSIP_HAS_TLS_TRANSPORT 1
          #include <pj/config_site_sample.h>
          SITE
          # 16 KB pages: r27 links its own output aligned, but pjproject drives its link
          # line itself, so the flag is stated rather than assumed. An unaligned .so is one
          # Android 15 refuses to load on a 16 KB device.
          export LDFLAGS="${LDFLAGS} -Wl,-z,max-page-size=16384"

          ./configure-android --use-ndk-cflags \
            --with-ssl="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}" \
            --with-opus="$GITHUB_WORKSPACE/prefix/${{ matrix.abi }}"

          echo "::group::configure summary - the SSL and Opus lines"
          grep -iE "ssl|opus|video" config.log | tail -40 || true
          echo "::endgroup::"

          # The whole point of the two cross-compiles above, asserted rather than eyeballed.
          # `configure-android` does NOT fail when it cannot find OpenSSL or Opus - it
          # quietly builds a stack without TLS and without wideband audio, and the first
          # anybody knows is a TLS account failing on a handset (DoD 13) or a call that
          # sounds like 2005 (§5.2). A build that silently drops them is worse than no
          # build, so this stops here instead.
          if ! grep -qE '^#define PJ_HAS_SSL_SOCK[[:space:]]+1' pjlib/include/pj/compat/os_auto.h 2>/dev/null \
             && ! grep -qiE 'ssl.*(enabled|found)' config.log; then
            echo "::error::TLS is NOT enabled - configure did not find OpenSSL. See --with-ssl."
            exit 1
          fi
          if ! grep -qiE 'opus.*(enabled|found)|found opus' config.log; then
            echo "::error::Opus is NOT enabled - configure did not find it. See --with-opus."
            exit 1
          fi

          make dep && make clean && make -j"$(nproc)"

      - name: Build the pjsua2 Java bindings
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          cd pjproject/pjsip-apps/src/swig
          make

      - name: Confirm the result is 16 KB aligned
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # The check that matters for Play. A .so that is not 16 KB aligned is one
          # Android 15 will refuse to load on a 16 KB device.
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          # This used to print the LOAD headers and stop, which is a check that cannot
          # fail. It now asserts every loadable segment is aligned to at least 16 KB
          # (0x4000) and exits non-zero otherwise - the alignment is the reason the step
          # exists, and Play rejects the upload rather than warning about it.
          found=0
          status=0
          while IFS= read -r -d '' so; do
            found=1
            echo "--- $so"
            "$READELF" -lW "$so" | awk '$1 == "LOAD"'
            if "$READELF" -lW "$so" | awk '$1 == "LOAD" { print $NF }' \
                 | grep -qvE '^0x(4000|8000|10000)$'; then
              echo "::error::$so has a LOAD segment aligned under 16 KB"
              status=1
            fi
          done < <(find pjproject -name 'libpjsua2.so' -print0)

          if [ "$found" -eq 0 ]; then
            echo "::error::No libpjsua2.so was produced - the SWIG step did not build it"
            exit 1
          fi
          exit "$status"

      # Nothing downstream can consume `pjsip-apps/src/swig/java/android/**` as it lies -
      # it is a sample app tree. An AAR needs the .so under `jni/<abi>/` and the generated
      # bindings as a flat Java source root, so they are gathered into that shape here
      # while the paths are still known, rather than re-derived by whoever assembles it.
      - name: Gather the pieces into a consumable layout
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mkdir -p "staging/jni/$ABI" staging/java

          find pjproject -name 'libpjsua2.so' -exec cp -v {} "staging/jni/$ABI/" \;

          # The SWIG-generated bindings. Same for every ABI, and harmless to carry three
          # times: whoever assembles the AAR takes one copy, and the three must agree anyway.
          #
          # `-print -quit` rather than `| head -1`: under `set -o pipefail`, head closing
          # the pipe early hands find a SIGPIPE, and the step fails on a search that
          # succeeded. Stopping find itself has no pipe to break.
          srcroot="$(find pjproject/pjsip-apps/src/swig -type d -path '*/org/pjsip' -print -quit)"
          if [ -z "$srcroot" ]; then
            echo "::error::SWIG produced no org/pjsip bindings"
            exit 1
          fi
          # Copy the `org` root, so the tree keeps the package layout javac expects.
          cp -r "$(dirname "$srcroot")" staging/java/

          echo "::group::staged"
          find staging -type f | sed 's/^/  /'
          echo "::endgroup::"

      - name: Publish the build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: pjsip-${{ inputs.pjsip-version }}-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            staging/**
            pjproject/**/lib/*.a
